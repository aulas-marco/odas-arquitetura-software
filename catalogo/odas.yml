trilhas:
  - {numero: 1, titulo: "Visão geral de estilos arquiteturais (Módulo 1)"}
  - {numero: 2, titulo: "Arquitetura de APIs (Módulo 2)"}

odas:
  - id: "01"
    titulo: "Camadas e monólito modular"
    trilha: 1
    repositorio: odas-arquitetura-software
    fontes: ["modulo-1-visao-geral/padroes-e-decisoes.md#camadas", "modulo-1-visao-geral/padroes-e-decisoes.md#monolito-modular-uma-implantacao-capacidades-com-autonomia-interna", "modulo-1-visao-geral/padroes-e-decisoes.md#adr-o-mecanismo-para-escolher-estilos"]
    minutos: 25
    pre_requisitos: []
    objetivo: "Reconhecer, em código executável, a regra de dependência das camadas e a fronteira entre módulos de um monólito modular."
    situacao: disponivel
    app: oda-01
  - id: "02"
    titulo: "Pipes and Filters e Microkernel"
    trilha: 1
    repositorio: odas-arquitetura-software
    fontes: ["modulo-1-visao-geral/padroes-e-decisoes.md#pipes-and-filters", "modulo-1-visao-geral/padroes-e-decisoes.md#microkernel", "modulo-1-visao-geral/padroes-e-decisoes.md#adr-o-mecanismo-para-escolher-estilos"]
    minutos: 25
    pre_requisitos: ["01"]
    objetivo: "Reconhecer, em código executável, como um pipeline de filtros e um núcleo com plugins acomodam mudança sem alterar as partes existentes."
    situacao: disponivel
    app: oda-02
  - id: "03"
    titulo: "REST e gRPC"
    trilha: 2
    repositorio: odas-arquitetura-software
    fontes: ["modulo-2-apis/exemplo-arquitetural.md#elegibilidade-como-recurso-rest", "modulo-2-apis/exemplo-arquitetural.md#elegibilidade-como-operacao-grpc", "modulo-2-apis/conceitos.md#alem-do-http-estilos-de-apis"]
    minutos: 25
    pre_requisitos: []
    objetivo: "Comparar, em código executável, a mesma capacidade exposta como recurso REST e como operação gRPC, com seus contratos, erros e mensagens."
    situacao: disponivel
    app: oda-03
  - id: "04"
    titulo: "GraphQL e WebSocket"
    trilha: 2
    repositorio: odas-arquitetura-software
    fontes: ["modulo-2-apis/exemplo-arquitetural.md#selecao-de-campos-com-graphql", "modulo-2-apis/exemplo-arquitetural.md#aviso-de-mudanca-por-websocket", "modulo-2-apis/exemplo-arquitetural.md#comparacao-dos-quatro-estilos-no-caso-hospitalar"]
    minutos: 25
    pre_requisitos: ["03"]
    objetivo: "Reconhecer, em código executável, a seleção de campos e os resolvers do GraphQL e o envio de mudanças pelo canal aberto do WebSocket."
