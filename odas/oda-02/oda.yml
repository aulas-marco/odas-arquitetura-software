- id: verificacao
  titulo: Verificação
  blocos:
  - tipo: legenda
    texto: As perguntas abaixo tratam do conteúdo do Módulo 1 do material oficial. Cada alternativa exibe uma explicação depois
      da escolha.
  - tipo: quiz
    perguntas:
    - enunciado: Qual tipo de filtro avalia os dados contra um critério e descarta os que não passam?
      alternativas:
      - texto: Producer
        correta: false
        explicacao: O producer é a entrada do fluxo e gera ou lê os dados iniciais.
      - texto: Tester
        correta: true
        explicacao: Na triagem de currículos da oficina, `FiltroPorExperienciaMinima` é um tester.
      - texto: Transformer
        correta: false
        explicacao: O transformer aplica uma transformação e emite os dados sem descartar.
    - enunciado: Qual é o papel do filtro do tipo consumer?
      alternativas:
      - texto: Encerrar o fluxo e persistir ou enviar os dados processados.
        correta: true
        explicacao: O material oficial cita como exemplos a gravação no banco, o envio de e-mail e a publicação em fila.
      - texto: Ler os dados de uma fila e iniciar o fluxo.
        correta: false
        explicacao: Esse é o papel do producer.
      - texto: Normalizar campos antes do processamento.
        correta: false
        explicacao: Esse é o papel de um transformer.
    - enunciado: Qual é a premissa fundamental do estilo Pipes and Filters, segundo Richards e Ford?
      alternativas:
      - texto: A ausência de estado compartilhado entre os filtros.
        correta: true
        explicacao: Cada filtro processa os dados recebidos e desconhece a origem e o destino deles.
      - texto: A execução paralela de todos os filtros.
        correta: false
        explicacao: A paralelização vale apenas para etapas independentes, e a ordenação também é contrato.
      - texto: A comunicação direta entre filtros vizinhos.
        correta: false
        explicacao: Os filtros se comunicam somente pelos pipes.
    - enunciado: Um filtro acumula um total interno entre chamadas sem declarar esse estado. Qual é a consequência?
      alternativas:
      - texto: O pipeline passa a depender da ordem de execução e deixa de ser determinístico.
        correta: true
        explicacao: O material oficial chama esse anti-padrão de estado compartilhado invisível e recomenda um mecanismo externo
          declarado.
      - texto: O pipeline ganha throughput, porque evita recalcular valores.
        correta: false
        explicacao: O ganho aparente vem acompanhado de acoplamento implícito entre as execuções.
      - texto: O filtro passa a ser classificado como consumer.
        correta: false
        explicacao: A classificação depende do papel do filtro no fluxo.
    - enunciado: Na avaliação de Richards e Ford, qual destas características de Pipes and Filters recebe a nota mais baixa?
      alternativas:
      - texto: Testabilidade
        correta: false
        explicacao: A testabilidade recebe nota 5, porque cada filtro é testável em isolamento.
      - texto: Desempenho
        correta: true
        explicacao: O desempenho recebe nota 2, porque o processamento sequencial acumula latência entre as etapas.
      - texto: Modularidade
        correta: false
        explicacao: A modularidade recebe nota 5, por construção do estilo.
    - enunciado: Em qual situação o material oficial desaconselha Pipes and Filters?
      alternativas:
      - texto: Processamento de logs em múltiplas etapas.
        correta: false
        explicacao: O processamento de logs é um dos usos indicados.
      - texto: Etapas que precisam compartilhar estado mútuo.
        correta: true
        explicacao: O compartilhamento de estado elimina a independência dos filtros.
      - texto: ETL entre uma origem e um destino.
        correta: false
        explicacao: ETL é um dos usos indicados.
    - enunciado: No estilo Microkernel, como o material oficial descreve a evolução do núcleo e dos plugins?
      alternativas:
      - texto: O núcleo evolui lentamente, e os plugins evoluem rapidamente e de forma independente.
        correta: true
        explicacao: A única relação entre o núcleo e os plugins é o contrato definido pelo núcleo.
      - texto: O núcleo e os plugins evoluem juntos, numa mesma versão.
        correta: false
        explicacao: Os plugins podem ser implantados independentemente do núcleo.
      - texto: Os plugins evoluem lentamente, porque dependem uns dos outros.
        correta: false
        explicacao: Os plugins desconhecem uns aos outros.
    - enunciado: O núcleo de um sistema fiscal passa a conter um `if` para cada estado atendido. Qual anti-padrão aparece?
      alternativas:
      - texto: Sumidouro
        correta: false
        explicacao: O sumidouro é um anti-padrão do estilo em camadas.
      - texto: Core creep
        correta: true
        explicacao: Qualquer lógica que varia entre clientes ou regiões pertence a um plugin.
      - texto: Estado compartilhado invisível
        correta: false
        explicacao: Esse anti-padrão pertence ao estilo Pipes and Filters.
    - enunciado: Por que o contrato entre o núcleo e os plugins precisa ser estável?
      alternativas:
      - texto: Porque cada mudança no contrato quebra os plugins existentes.
        correta: true
        explicacao: O material oficial recomenda também versionar o contrato, para que versões diferentes de plugins coexistam.
      - texto: Porque o núcleo não pode ser testado com contratos diferentes.
        correta: false
        explicacao: O núcleo é fácil de testar, segundo a avaliação de Richards e Ford.
      - texto: Porque o registro só aceita um plugin por categoria.
        correta: false
        explicacao: O registro pode guardar vários plugins por categoria, como os impostos de SP e RJ da oficina.
    - enunciado: Qual é o custo de implantar plugins fora do processo do núcleo (out-of-process)?
      alternativas:
      - texto: A implantação passa a acontecer junto com o núcleo.
        correta: false
        explicacao: Essa característica é da forma in-process.
      - texto: A latência de rede entre o núcleo e o plugin.
        correta: true
        explicacao: Em troca, o plugin ganha implantação e escala independentes do núcleo.
      - texto: A dependência de disponibilidade de um provedor externo.
        correta: false
        explicacao: Essa característica é da forma SaaS.
