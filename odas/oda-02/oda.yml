id: '02'
titulo: Pipes and Filters e Microkernel
abas:
- id: objetivo
  titulo: Objetivo
  blocos:
  - tipo: legenda
    texto: Esta ODA apresenta dois estilos que acomodam mudanças sem alteração das partes existentes, por meio de programas
      Python prontos para execução. A atividade dura 25 minutos distribuídos entre as quatro abas.
  - tipo: glossario
    texto: Os termos abaixo aparecem nas abas desta ODA na ordem em que surgem. Cada aba repete a explicação do termo no primeiro
      uso, porque o aluno pode abrir qualquer aba diretamente.
    itens:
    - termo: Estilo arquitetural
      definicao: Forma conhecida de organizar as partes de um sistema e as regras de dependência entre elas. Pipes and Filters
        e Microkernel são estilos arquiteturais.
      referencia:
        rotulo: Material oficial · Estilos arquiteturais
        url: https://marco-mendes.github.io/arquitetura-software/modulo-1-visao-geral/conceitos/#estilos-arquiteturais
    - termo: Filtro
      definicao: Etapa de processamento que recebe um item e o devolve ao fluxo ou o descarta. Na triagem de currículos desta
        ODA, cada critério de seleção é um filtro.
    - termo: Pipe
      definicao: Ligação que entrega a saída de um filtro como entrada do filtro seguinte. Na triagem, a classe `Pipeline`
        faz esse papel.
    - termo: Contrato
      definicao: Conjunto de métodos que uma parte do sistema se compromete a oferecer. Todo filtro implementa o método `processar`,
        e todo plugin implementa os métodos `aplica_se` e `executar`.
    - termo: Núcleo
      definicao: Parte estável de um sistema em Microkernel, com o mínimo necessário para o funcionamento. No faturamento
        desta ODA, o núcleo conhece a ordem das categorias de plugin.
    - termo: Plugin
      definicao: Extensão que implementa o contrato do núcleo e acrescenta um comportamento variável, como o imposto de um
        estado.
    - termo: Registro
      definicao: Componente do núcleo que guarda os plugins disponíveis e a categoria de cada um.
    - termo: ADR (Architecture Decision Record)
      definicao: Registro de decisão arquitetural. É um documento curto e versionado que registra uma escolha de arquitetura
        e os motivos dela.
      referencia: &id001
        rotulo: Material oficial · ADR
        url: https://marco-mendes.github.io/arquitetura-software/modulo-1-visao-geral/padroes-e-decisoes/#adr-o-mecanismo-para-escolher-estilos
  - tipo: checklist
    titulo: Ao concluir, você poderá
    itens:
    - Identificar os tipos de filtro presentes na triagem de currículos.
    - Explicar a dependência entre filtros criada pela ordem do pipeline.
    - Explicar como um estado novo entra no faturamento sem alteração do núcleo.
    - Reconhecer o anti-padrão core creep e ler um ADR sobre a escolha de um dos estilos.
  - tipo: faixa
    estilo: dica
    titulo: 🧭 Como ter o código na sua máquina
    texto: O código desta ODA está na pasta `codigo/` do repositório `odas-arquitetura-software`. Quem concluiu o Módulo 0
      já tem o repositório clonado e precisa apenas executar `git pull` dentro da pasta dele. Os caminhos de arquivo citados
      nas abas partem da raiz do repositório, e os trechos exibidos correspondem ao commit `f9f8fde`.
    links:
    - rotulo: 'Módulo 0: preparação do ambiente'
      url: https://aulas-marco.github.io/odas-arquitetura-software/modulo-0/
    - rotulo: Repositório no GitHub, commit f9f8fde
      url: https://github.com/aulas-marco/odas-arquitetura-software/tree/f9f8fde
  - tipo: faixa
    estilo: dica
    titulo: 📚 No material oficial
    texto: Os links abaixo levam às seções do material oficial cobertas por esta ODA. Os códigos das pastas `pipes-and-filters/`
      e `microkernel/` são cópias do código dos Experimentos 2 e 3 da Oficina de ferramentas, acrescidas de quatro arquivos
      criados para o Laboratório.
    links:
    - &id002
      rotulo: Material oficial · Pipes and Filters
      url: https://marco-mendes.github.io/arquitetura-software/modulo-1-visao-geral/padroes-e-decisoes/#pipes-and-filters
    - &id003
      rotulo: Material oficial · Microkernel
      url: https://marco-mendes.github.io/arquitetura-software/modulo-1-visao-geral/padroes-e-decisoes/#microkernel
    - *id001
    - &id004
      rotulo: Material oficial · Oficina, Experimento 2
      url: https://marco-mendes.github.io/arquitetura-software/modulo-1-visao-geral/oficina-de-ferramentas/#experimento-2-pipes-and-filters-triagem-de-curriculos-35-minutos
    - &id005
      rotulo: Material oficial · Oficina, Experimento 3
      url: https://marco-mendes.github.io/arquitetura-software/modulo-1-visao-geral/oficina-de-ferramentas/#experimento-3-microkernel-faturamento-por-plugins-35-minutos
- id: conceitos
  titulo: Conceitos
  blocos:
  - tipo: legenda
    texto: Esta aba retoma os conceitos expostos em aula e associa cada conceito a um trecho do código. Os trechos servem
      de referência durante o Laboratório.
  - tipo: faixa
    estilo: dica
    titulo: 📂 Onde está o código
    texto: Os arquivos desta aba ficam em `codigo/oda-02/pipes-and-filters/` e `codigo/oda-02/microkernel/` no repositório
      `odas-arquitetura-software`, e o botão Ver no GitHub de cada trecho abre o arquivo completo no navegador. No VS Code,
      o atalho Ctrl+P (Cmd+P no macOS) localiza qualquer arquivo pelo caminho exibido no trecho.
    links:
    - rotulo: Repositório no GitHub, commit f9f8fde
      url: https://github.com/aulas-marco/odas-arquitetura-software/tree/f9f8fde
  - tipo: conceito
    titulo: Pipes and Filters
    texto: O estilo Pipes and Filters decompõe um processamento em filtros ligados por pipes. Filtro é uma etapa que recebe
      um item e o devolve ao fluxo ou o descarta, e pipe é a ligação que entrega a saída de um filtro ao filtro seguinte.
      Cada filtro desconhece os demais e trabalha sem estado compartilhado, o que permite acrescentar ou retirar um filtro
      sem alterar os outros. Richards e Ford chamam o estilo de Pipeline Architecture.
  - tipo: conceito
    titulo: Tipos de filtro
    texto: O material oficial classifica os filtros em quatro tipos. A tabela abaixo associa cada tipo às classes da triagem
      de currículos.
  - tipo: comparativo
    colunas:
    - Função
    - Classes na triagem
    linhas:
    - dimensao: Producer
      valores:
      - Entrega os dados iniciais ao fluxo
      - '`LeitorDeCurriculos`'
    - dimensao: Tester
      valores:
      - Descarta os itens que não atendem a um critério
      - '`ValidadorDeCurriculo`, `FiltroPorExperienciaMinima`, `FiltroPorPretensaoSalarial`'
    - dimensao: Transformer
      valores:
      - Altera o item e o mantém no fluxo
      - '`NormalizadorDeCampos`, `CalculadorDeScore`'
    - dimensao: Consumer
      valores:
      - Encerra o fluxo e apresenta o resultado
      - '`RelatorioDeTriagem`'
  - tipo: diagrama
    id: D-01
    tipo_diagrama: Fluxo
    titulo: Pipeline da triagem de currículos
    mermaid: "flowchart TB\n    L([\"LeitorDeCurriculos<br/>producer\"]) --> V[\"ValidadorDeCurriculo<br/>tester\"]\n    V\
      \ --> N[\"NormalizadorDeCampos<br/>transformer\"]\n    N --> E[\"FiltroPorExperienciaMinima<br/>tester\"]\n    E -->\
      \ P[\"FiltroPorPretensaoSalarial<br/>tester\"]\n    P --> C[\"CalculadorDeScore<br/>transformer\"]\n    C --> R([\"\
      RelatorioDeTriagem<br/>consumer\"])\n    V -. \"descartado\" .-> X[/\"fora do fluxo\"/]"
  - tipo: editor
    rotulo: arquivo
    caminho: codigo/oda-02/pipes-and-filters/framework.py
    commit: f9f8fde
    contexto: O arquivo `framework.py` define o contrato de filtro e a classe que encadeia os filtros. Nenhum critério de
      triagem aparece neste arquivo.
    inicio: 10
    linhas:
    - 'class Filtro:'
    - '    """Contrato único que todos os filtros cumprem."""'
    - ''
    - '    def processar(self, item: Curriculo) -> Curriculo | None:'
    - '        raise NotImplementedError'
    - ''
    - ''
    - 'class Pipeline:'
    - '    def __init__(self) -> None:'
    - '        self._filtros: list[Filtro] = []'
    - ''
    - '    def adicionar(self, filtro: Filtro) -> "Pipeline":'
    - '        self._filtros.append(filtro)'
    - '        return self'
    - ''
    - '    def executar(self, itens: list[Curriculo]) -> list[Curriculo]:'
    - '        """Cada filtro processa a corrente inteira antes de passá-la adiante."""'
    - '        corrente = list(itens)'
    - '        for filtro in self._filtros:'
    - '            corrente = ['
    - '                saida'
    - '                for saida in (filtro.processar(item) for item in corrente)'
    - '                if saida is not None'
    - '            ]'
    - '        return corrente'
    anotacoes:
    - linha: 13
      texto: Todo filtro recebe um item e devolve um item, ou None para retirá-lo do fluxo.
    - linha: 28
      texto: A saída de cada filtro passa a ser a entrada do filtro seguinte.
  - tipo: conceito
    titulo: Dependência entre filtros pela ordem do pipeline
    texto: Um filtro pode depender do resultado de um filtro anterior. O `CalculadorDeScore` compara habilidades escritas
      em letras minúsculas, e a conversão para minúsculas é feita pelo `NormalizadorDeCampos`. A montagem do pipeline em `main.py`
      declara essa ordem, e o Laboratório executa uma variante sem o normalizador para mostrar o efeito no score.
  - tipo: editor
    rotulo: arquivo
    caminho: codigo/oda-02/pipes-and-filters/main.py
    commit: f9f8fde
    contexto: O arquivo `main.py` monta o pipeline da triagem. A sequência de chamadas ao método `adicionar` define a ordem
      do fluxo.
    inicio: 33
    linhas:
    - '    pipeline = ('
    - '        Pipeline()'
    - '        .adicionar(ValidadorDeCurriculo())'
    - '        .adicionar(NormalizadorDeCampos())'
    - '        .adicionar(FiltroPorExperienciaMinima(vaga))'
    - '        .adicionar(FiltroPorPretensaoSalarial(vaga))'
    - '        .adicionar(CalculadorDeScore(vaga))'
    - '        .adicionar(relatorio)'
    anotacoes:
    - linha: 36
      texto: Converte nomes e habilidades para um formato único antes do cálculo de score.
  - tipo: conceito
    titulo: Estado compartilhado invisível
    texto: O anti-padrão de Pipes and Filters é o filtro que guarda estado interno sem declará-lo, como um total acumulado
      entre chamadas. Com esse estado, o resultado passa a depender da ordem de execução dos itens. Quando o fluxo precisa
      acumular valores, o material oficial recomenda um armazenamento externo declarado.
  - tipo: conceito
    titulo: Microkernel
    texto: O estilo Microkernel, que Richards e Ford chamam de Plug-in Architecture, separa um núcleo estável das extensões
      variáveis. O núcleo contém o registro dos plugins disponíveis e a orquestração que define a ordem de execução. Plugin
      é uma extensão que implementa o contrato definido pelo núcleo, e os plugins desconhecem uns aos outros.
  - tipo: diagrama
    id: D-02
    tipo_diagrama: Estrutura
    titulo: Núcleo e plugins do faturamento
    mermaid: "flowchart TB\n    REG[\"Registro\"] --> NUC[\"Nucleo<br/>ordem das categorias\"]\n    NUC -->|\"contrato Plugin\"\
      | SP[\"impostos_sp.py\"]\n    NUC --> RJ[\"impostos_rj.py\"]\n    NUC --> FR[\"frete.py\"]\n    NUC --> NT[\"notificacao.py\"\
      ]\n    NUC -. \"plugin novo\" .-> MG[\"impostos_mg.py\"]"
  - tipo: editor
    rotulo: arquivo
    caminho: codigo/oda-02/microkernel/nucleo.py
    commit: f9f8fde
    contexto: O arquivo `nucleo.py` define o contrato de plugin e a classe `Nucleo`, que executa os plugins registrados. Nenhum
      imposto e nenhum estado aparecem neste arquivo.
    inicio: 10
    linhas:
    - ORDEM_CATEGORIAS = ("impostos", "frete", "notificacao")
    - ''
    - ''
    - 'class Plugin:'
    - '    """O contrato de extensão. Mudá-lo obriga todos os plugins a mudar."""'
    - ''
    - '    nome: str = ""'
    - '    categoria: str = ""'
    - ''
    - '    def aplica_se(self, fatura: Fatura) -> bool:'
    - '        return True'
    - ''
    - '    def executar(self, fatura: Fatura) -> None:'
    - '        raise NotImplementedError'
    anotacoes:
    - linha: 10
      texto: O núcleo conhece apenas as categorias e a ordem de execução delas.
    - linha: 19
      texto: Cada plugin decide se vale para a fatura, por exemplo pelo estado do cliente.
  - tipo: editor
    rotulo: arquivo
    caminho: codigo/oda-02/microkernel/plugins/impostos_rj.py
    commit: f9f8fde
    contexto: O arquivo `plugins/impostos_rj.py` é um plugin completo e contém toda a regra tributária do Rio de Janeiro.
    inicio: 9
    linhas:
    - 'class IcmsRJ(Plugin):'
    - '    nome = "ICMS-RJ"'
    - '    categoria = "impostos"'
    - ''
    - '    def aplica_se(self, fatura: Fatura) -> bool:'
    - '        return fatura.estado == "RJ"'
    - ''
    - '    def executar(self, fatura: Fatura) -> None:'
    - '        base = sum(i.total for i in fatura.itens if i.categoria == "eletronico")'
    - '        if base:'
    - '            fatura.ajustes.append(("ICMS-RJ", base * ALIQUOTA_ICMS))'
  - tipo: conceito
    titulo: Core creep
    texto: Core creep é o anti-padrão em que o núcleo acumula regras pertencentes aos plugins, em geral como uma sequência
      de condicionais por estado ou por cliente. Cada variação nova passa a exigir uma nova versão do núcleo. O arquivo `nucleo_com_creep.py`
      exibido abaixo mostra esse núcleo com uma condicional para SP e outra para RJ.
  - tipo: editor
    rotulo: arquivo
    caminho: codigo/oda-02/microkernel/nucleo_com_creep.py
    commit: f9f8fde
    contexto: O arquivo `nucleo_com_creep.py` mostra o núcleo com a regra de cada estado escrita dentro dele. O programa `main.py`
      não usa este arquivo.
    inicio: 11
    linhas:
    - 'class NucleoComCreep:'
    - '    def processar(self, fatura: Fatura) -> None:'
    - '        eletronicos = sum(i.total for i in fatura.itens if i.categoria == "eletronico")'
    - '        if fatura.estado == "SP":'
    - '            fatura.ajustes.append(("ICMS-SP", eletronicos * 0.18))'
    - '        elif fatura.estado == "RJ":'
    - '            fatura.ajustes.append(("ICMS-RJ", eletronicos * 0.20))'
    - '        # Minas Gerais exigiria mais um elif dentro do núcleo.'
    anotacoes:
    - linha: 16
      texto: Regra de plugin dentro do núcleo, que exige um elif por estado.
  - tipo: comparativo
    colunas:
    - Pipes and Filters
    - Microkernel
    linhas:
    - dimensao: Forma de acomodar mudança
      valores:
      - Inclusão, remoção ou troca de filtros
      - Inclusão de plugins
    - dimensao: Parte estável
      valores:
      - Contrato de filtro e encadeador
      - Núcleo e contrato de plugin
    - dimensao: Anti-padrão
      valores:
      - Estado compartilhado invisível
      - Core creep
    - dimensao: Testabilidade (1 a 5)
      valores:
      - '5'
      - '3'
    - dimensao: Modularidade (1 a 5)
      valores:
      - '5'
      - '4'
    - dimensao: Desempenho (1 a 5)
      valores:
      - '2'
      - '3'
  - tipo: conceito
    titulo: ADR
    texto: ADR é a sigla de Architecture Decision Record, em português registro de decisão arquitetural. O ADR é um documento
      curto e versionado junto com o código que registra uma escolha de arquitetura e os motivos dela. O bloco abaixo contém
      um ADR de exemplo para o faturamento desta ODA, com os campos do template do material oficial.
  - tipo: adr
    id: ADR-002
    titulo: Calcular impostos por estado com Microkernel
    status: Aceita (exemplo didático)
    contexto: O faturamento atende clientes de vários estados, e as regras tributárias de cada estado mudam com frequência.
      A sequência de cálculo é igual para todos os estados e começa sempre pelos impostos.
    decisao: Manter no núcleo apenas o registro e a ordem das categorias. A regra de cada estado será implementada como um
      plugin que cumpre o contrato Plugin.
    alternativas: As condicionais por estado dentro do núcleo foram descartadas porque cada estado novo exigiria uma nova
      versão do núcleo. Pipes and Filters foi descartado porque o problema central é a variação de regras por estado, e o
      estilo trata de sequências de transformação de dados.
    consequencias: Um estado novo entra por um arquivo na pasta plugins e por uma linha de registro. O contrato Plugin precisa
      permanecer estável, porque uma mudança nele obriga todos os plugins a mudar.
  - tipo: faixa
    estilo: dica
    titulo: 📚 No material oficial
    texto: As notas de 1 a 5 do comparativo vêm das tabelas de características arquiteturais do material oficial, que seguem
      Richards e Ford. Os links abaixo levam às seções usadas nesta aba.
    links:
    - *id002
    - *id003
    - &id006
      rotulo: 'Material oficial · O caso canônico: cálculo de impostos'
      url: https://marco-mendes.github.io/arquitetura-software/modulo-1-visao-geral/padroes-e-decisoes/#o-caso-canonico-calculo-de-impostos
    - *id001
    - &id007
      rotulo: Material oficial · Template de ADR
      url: https://marco-mendes.github.io/arquitetura-software/referencia/template-adr/
- id: laboratorio
  titulo: Laboratório
  blocos:
  - tipo: legenda
    texto: O Laboratório executa quatro programas prontos e compara as saídas em pares. Nenhum arquivo precisa ser alterado,
      e o tempo previsto é de 12 minutos.
  - tipo: glossario
    titulo: 📘 Conceitos usados nesta aba
    texto: Os termos técnicos desta aba estão explicados abaixo na ordem em que aparecem.
    itens:
    - termo: Terminal
      definicao: Programa em que se digitam comandos de texto, chamado PowerShell no Windows e Terminal no macOS e no Linux.
        O VS Code abre um terminal integrado pelo menu Terminal › Novo Terminal.
    - termo: cd
      definicao: Comando que muda a pasta atual do terminal. Cada programa desta ODA precisa ser executado de dentro da própria
        pasta.
    - termo: Filtro e pipeline
      definicao: Filtro é uma etapa que recebe um item e o devolve ou descarta. Pipeline é a sequência de filtros montada
        em `main.py`.
    - termo: Score
      definicao: Percentual das habilidades exigidas pela vaga que aparecem no currículo, calculado pelo filtro `CalculadorDeScore`.
    - termo: Núcleo e plugin
      definicao: O núcleo é a parte estável que conhece a ordem das categorias. O plugin é a extensão que contém a regra de
        um estado.
  - tipo: faixa
    estilo: objetivo
    problema: Na triagem, o cálculo de score depende do formato produzido por outro filtro. No faturamento, a regra de cada
      estado pode ser escrita dentro do núcleo como mais uma condicional.
    impacto: A remoção de um filtro sem conhecimento dessa dependência altera o resultado sem mensagem de erro. Regras de
      estado dentro do núcleo exigem uma nova versão do núcleo a cada estado acrescentado.
    mecanismo: A variante `sem_normalizador.py` monta o pipeline com os mesmos filtros, exceto o normalizador. O programa
      `com_minas_gerais.py` registra o plugin novo `plugins/impostos_mg.py` sem alteração de `nucleo.py`.
    comprovacao: Sem o normalizador, o score de Ana Lima cai de 100% para 0%. A fatura de Minas Gerais recebe ICMS-MG de R$900.00,
      e a busca por MG em `nucleo.py` não encontra nenhuma ocorrência.
  - tipo: faixa
    estilo: dica
    titulo: 💻 Comandos por sistema operacional
    texto: Os comandos desta aba usam `python3`, que é o nome do interpretador Python no macOS e no Linux. No Windows o mesmo
      programa é executado pelo comando `py`, como em `py main.py`. O comando `cd` funciona da mesma forma no PowerShell e
      aceita a barra `/` nos caminhos de pasta.
  - tipo: passos
    itens:
    - titulo: Abrir o terminal na raiz do repositório
      texto: No VS Code, abra a pasta `odas-arquitetura-software` pelo menu Arquivo › Abrir Pasta. Em seguida, abra um terminal
        pelo menu Terminal › Novo Terminal e atualize o repositório.
      editor:
        rotulo: terminal
        linhas:
        - git pull
    - titulo: Executar a triagem completa
      texto: Entre na pasta da triagem e execute o pipeline. Cada linha de descarte ou reprovação da saída foi impressa por
        um tester diferente.
      editor:
        rotulo: terminal
        linhas:
        - cd codigo/oda-02/pipes-and-filters
        - python3 main.py
  - tipo: editor
    rotulo: saida
    origem: executado
    linhas:
    - ============================================================
