    - Processando 6 currículos...
    - ''
    - 'Pipeline: LeitorDeCurriculos → ValidadorDeCurriculo → NormalizadorDeCampos → FiltroPorExperienciaMinima → FiltroPorPretensaoSalarial
      → CalculadorDeScore → RelatorioDeTriagem'
