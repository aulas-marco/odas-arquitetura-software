- id: verificacao
  titulo: Verificação
  blocos:
  - tipo: legenda
    texto: Responda às cinco perguntas. Cada alternativa traz uma explicação depois da escolha, com referência ao que você
      viu nas abas anteriores.
  - tipo: quiz
    perguntas:
    - enunciado: Na triagem de currículos, qual é o papel do `FiltroPorExperienciaMinima`?
      alternativas:
      - texto: Producer, porque entrega os currículos ao fluxo.
        correta: false
        explicacao: O producer é o `LeitorDeCurriculos`.
      - texto: Tester, porque avalia o currículo e descarta os que não atingem o mínimo.
        correta: true
        explicacao: Ele devolve None para o candidato com menos anos que o exigido, e o currículo sai do fluxo.
      - texto: Transformer, porque altera o currículo.
        correta: false
        explicacao: Ele não altera o currículo, apenas decide se ele continua.
    - enunciado: Por que Ana Lima caiu para 0% de score na variante sem o normalizador?
      alternativas:
      - texto: Porque o `CalculadorDeScore` foi alterado.
        correta: false
        explicacao: Nenhum arquivo de `filtros/` mudou entre as duas execuções.
      - texto: Porque o calculador compara habilidades em minúsculas, e o filtro que as convertia saiu do pipeline.
        correta: true
        explicacao: A dependência entre os filtros está na ordem do pipeline, declarada na montagem.
      - texto: Porque ela foi reprovada pelo filtro de experiência.
        correta: false
        explicacao: Ela continua aprovada, com score 0%.
    - enunciado: O que precisou mudar para o faturamento atender Minas Gerais?
      alternativas:
      - texto: Um novo `elif` em `nucleo.py`.
        correta: false
        explicacao: Esse seria o core creep, mostrado em `nucleo_com_creep.py`.
      - texto: Um arquivo novo em `plugins/` e uma linha de registro.
        correta: true
        explicacao: O núcleo não foi alterado, e a busca por MG em `nucleo.py` não encontra nada.
      - texto: O contrato `Plugin` ganhou um método novo.
        correta: false
        explicacao: O contrato continuou igual, e por isso os outros plugins não mudaram.
    - enunciado: Qual anti-padrão aparece quando o núcleo acumula condicionais por estado ou cliente?
      alternativas:
      - texto: Core creep
        correta: true
        explicacao: Cada variação nova volta ao núcleo, e a extensibilidade se perde.
      - texto: Sumidouro
        correta: false
        explicacao: O sumidouro é um anti-padrão do estilo em camadas.
      - texto: Estado compartilhado invisível
        correta: false
        explicacao: Esse é o anti-padrão de Pipes and Filters.
    - enunciado: No ADR-002 desta ODA, por que Pipes and Filters foi descartado para o cálculo de impostos?
      alternativas:
      - texto: Porque Pipes and Filters não pode ser testado.
        correta: false
        explicacao: A testabilidade é o ponto forte do estilo, com nota 5.
      - texto: Porque o problema central é a variação por estado, e não uma sequência de transformações de dados.
        correta: true
        explicacao: O campo Alternativas do ADR registra esse motivo.
      - texto: Porque o faturamento não tem etapas.
        correta: false
        explicacao: O faturamento tem etapas, e o núcleo as ordena por categoria.
  - tipo: resumo
  - tipo: checklist
    titulo: Para revisar depois da aula
    itens:
    - Ler as seções Quando usar Pipes and Filters e Quando usar Microkernel no material oficial.
    - Abrir o template de ADR do material oficial e comparar com o ADR-002 desta ODA.
