id: '02'
titulo: Pipes and Filters e Microkernel
abas:
- id: objetivo
  titulo: Objetivo
  blocos:
  - tipo: legenda
    texto: 'Esta ODA mostra, em código Python que você executa sem escrever nenhuma linha, dois estilos que acomodam mudança
      sem alterar as partes existentes. A atividade dura 25 minutos: 2 de Objetivo, 8 de Conceitos, 12 de Laboratório e 3
      de Verificação.'
  - tipo: glossario
    texto: Os termos abaixo aparecem nas abas desta ODA, na ordem em que surgem. Cada aba volta a explicá-los no primeiro
      uso, porque você pode abrir qualquer aba diretamente.
    itens:
    - termo: Estilo arquitetural
      definicao: 'Forma conhecida de organizar as partes de um sistema: os elementos, as ligações entre eles e as regras sobre
        o que pode depender de quê. Pipes and Filters e Microkernel são dois estilos.'
      referencia:
        rotulo: Material oficial · Estilos arquiteturais
        url: https://marco-mendes.github.io/arquitetura-software/modulo-1-visao-geral/conceitos/#estilos-arquiteturais
    - termo: Filtro
      definicao: Etapa de processamento que recebe um item, faz uma única coisa com ele e o devolve, ou o descarta. Na triagem
        de currículos, cada critério é um filtro.
    - termo: Pipe
      definicao: Ligação que leva a saída de um filtro à entrada do próximo. Na triagem, o pipe é a lista que a classe `Pipeline`
        passa de um filtro ao seguinte.
    - termo: Contrato
      definicao: Conjunto de métodos que uma parte do sistema promete oferecer. Todo filtro cumpre o contrato `processar`,
        e todo plugin cumpre o contrato `aplica_se` e `executar`.
    - termo: Núcleo
      definicao: No Microkernel, a parte que contém só o mínimo para o sistema funcionar e que muda pouco. No faturamento,
        o núcleo conhece a ordem das categorias e nada sobre impostos.
    - termo: Plugin
      definicao: Extensão que implementa o contrato do núcleo e acrescenta um comportamento variável, como o imposto de um
        estado.
    - termo: Registro
      definicao: Componente do núcleo que guarda quais plugins existem e em que categoria cada um atua.
    - termo: ADR (Architecture Decision Record)
      definicao: 'Registro de decisão arquitetural: documento curto e versionado que guarda o contexto, a decisão, as alternativas
        consideradas e as consequências de uma escolha de arquitetura.'
      referencia: &id001
        rotulo: Material oficial · ADR
        url: https://marco-mendes.github.io/arquitetura-software/modulo-1-visao-geral/padroes-e-decisoes/#adr-o-mecanismo-para-escolher-estilos
  - tipo: checklist
    titulo: Ao concluir, você poderá
    itens:
    - Identificar os quatro tipos de filtro na triagem de currículos.
    - Explicar por que a ordem dos filtros faz parte da arquitetura.
    - Explicar como um estado novo entra no faturamento sem alterar o núcleo.
    - Reconhecer o anti-padrão core creep e ler um ADR que registra a escolha de um dos estilos.
  - tipo: faixa
    estilo: dica
    titulo: 🧭 Como ter o código na sua máquina
    texto: O código desta ODA está no repositório `odas-arquitetura-software`, na pasta `codigo/`. Se você concluiu o Módulo
      0, o repositório já está clonado e basta atualizá-lo com `git pull` dentro da pasta dele. Os caminhos de arquivo citados
      nas abas partem da raiz desse repositório, e os trechos exibidos correspondem ao commit `bd84630`.
    links:
    - rotulo: Módulo 0 — preparar o ambiente
      url: https://aulas-marco.github.io/odas-arquitetura-software/modulo-0/
    - rotulo: Repositório no GitHub, commit bd84630
      url: https://github.com/aulas-marco/odas-arquitetura-software/tree/bd84630
  - tipo: faixa
    estilo: dica
    titulo: 📚 No material oficial
    texto: Esta ODA cobre as seções Pipes and Filters, Microkernel e ADR da página Padrões e decisões do Módulo 1, e os Experimentos
      2 e 3 da Oficina de ferramentas. Os códigos de `pipes-and-filters/` e `microkernel/` são cópias do código da oficina,
      com três arquivos acrescentados para o Laboratório.
    links:
    - &id002
      rotulo: Material oficial · Pipes and Filters
      url: https://marco-mendes.github.io/arquitetura-software/modulo-1-visao-geral/padroes-e-decisoes/#pipes-and-filters
    - &id003
      rotulo: Material oficial · Microkernel
      url: https://marco-mendes.github.io/arquitetura-software/modulo-1-visao-geral/padroes-e-decisoes/#microkernel
    - *id001
    - &id004
      rotulo: Material oficial · Oficina, Experimento 2
      url: https://marco-mendes.github.io/arquitetura-software/modulo-1-visao-geral/oficina-de-ferramentas/#experimento-2-pipes-and-filters-triagem-de-curriculos-35-minutos
    - &id005
      rotulo: Material oficial · Oficina, Experimento 3
      url: https://marco-mendes.github.io/arquitetura-software/modulo-1-visao-geral/oficina-de-ferramentas/#experimento-3-microkernel-faturamento-por-plugins-35-minutos
- id: conceitos
  titulo: Conceitos
  blocos:
  - tipo: legenda
    texto: Esta aba retoma os conceitos da exposição em aula e mostra cada um no código. Leia os blocos na ordem e use os
      trechos como referência durante o Laboratório.
  - tipo: faixa
    estilo: dica
    titulo: 📂 Onde está o código
    texto: Os arquivos desta aba ficam em `codigo/oda-02/pipes-and-filters/` e `codigo/oda-02/microkernel/`, no repositório
      `odas-arquitetura-software`. O botão Ver no GitHub de cada trecho abre o arquivo completo no navegador, e no VS Code
      o atalho Ctrl+P, ou Cmd+P no macOS, encontra o arquivo pelo caminho mostrado.
    links:
    - rotulo: Repositório no GitHub, commit bd84630
      url: https://github.com/aulas-marco/odas-arquitetura-software/tree/bd84630
  - tipo: conceito
    titulo: Pipes and Filters
    texto: Pipes and Filters decompõe um processamento em filtros ligados por pipes. Filtro é uma etapa que recebe um item,
      faz uma única coisa e o devolve, ou o descarta. Pipe é a ligação que leva a saída de um filtro à entrada do próximo.
      Os filtros não se conhecem e não compartilham estado, por isso podem ser acrescentados, removidos ou reordenados sem
      alterar os vizinhos. Richards e Ford chamam o estilo de Pipeline Architecture.
    analogia: 'Uma esteira de fábrica: cada etapa faz uma coisa e passa o resultado adiante.'
  - tipo: conceito
    titulo: Os quatro tipos de filtro
    texto: O producer é a entrada do fluxo e entrega os dados iniciais. O transformer altera o item sem descartá-lo. O tester
      avalia o item contra um critério e descarta os que não passam. O consumer é o fim do fluxo e grava ou apresenta o resultado.
      Na triagem de currículos, o leitor é o producer, o normalizador e o calculador de score são transformers, os validadores
      de nome, experiência e pretensão são testers, e o relatório é o consumer.
  - tipo: diagrama
    id: D-01
    tipo_diagrama: Fluxo
    titulo: Pipeline da triagem de currículos
    mermaid: "flowchart LR\n    L([\"LeitorDeCurriculos\\nproducer\"]) --> V{\"ValidadorDeCurriculo\\ntester\"}\n    V -->\
      \ N[\"NormalizadorDeCampos\\ntransformer\"] --> E{\"FiltroPorExperienciaMinima\\ntester\"}\n    E --> P{\"FiltroPorPretensaoSalarial\\\
      ntester\"} --> C[\"CalculadorDeScore\\ntransformer\"]\n    C --> R([\"RelatorioDeTriagem\\nconsumer\"])\n    V -. descartado\
      \ .-> X[/\"fora do fluxo\"/]"
  - tipo: editor
    rotulo: arquivo
    caminho: codigo/oda-02/pipes-and-filters/framework.py
    commit: bd84630
    contexto: O arquivo `framework.py` define o contrato de filtro e a classe que encadeia os filtros. Ele não conhece nenhum
      critério de triagem.
    inicio: 10
    linhas:
    - 'class Filtro:'
    - '    """Contrato único que todos os filtros cumprem."""'
    - ''
    - '    def processar(self, item: Curriculo) -> Curriculo | None:'
    - '        raise NotImplementedError'
    - ''
    - ''
    - 'class Pipeline:'
    - '    def __init__(self) -> None:'
    - '        self._filtros: list[Filtro] = []'
    - ''
    - '    def adicionar(self, filtro: Filtro) -> "Pipeline":'
    - '        self._filtros.append(filtro)'
    - '        return self'
    - ''
    - '    def executar(self, itens: list[Curriculo]) -> list[Curriculo]:'
    - '        """Cada filtro processa a corrente inteira antes de passá-la adiante."""'
    - '        corrente = list(itens)'
    - '        for filtro in self._filtros:'
    - '            corrente = ['
    - '                saida'
    - '                for saida in (filtro.processar(item) for item in corrente)'
    - '                if saida is not None'
    - '            ]'
    - '        return corrente'
    anotacoes:
    - linha: 13
      texto: 'O contrato único: receber um item e devolver um item, ou None para tirá-lo do fluxo.'
    - linha: 28
      texto: 'O pipe: a saída de cada filtro vira a entrada do próximo.'
  - tipo: conceito
    titulo: A ordem dos filtros é arquitetura
    texto: Um filtro pode depender do que um filtro anterior fez. O `CalculadorDeScore` compara habilidades em letras minúsculas,
      e quem as deixa em minúsculas é o `NormalizadorDeCampos`. A montagem do pipeline em `main.py` declara essa ordem. No
      Laboratório, você executa uma variante sem o normalizador e vê o efeito no score.
  - tipo: editor
    rotulo: arquivo
    caminho: codigo/oda-02/pipes-and-filters/main.py
    commit: bd84630
    contexto: O arquivo `main.py` monta o pipeline da triagem. A sequência de chamadas a `adicionar` é a arquitetura do fluxo.
    inicio: 33
    linhas:
    - '    pipeline = ('
    - '        Pipeline()'
    - '        .adicionar(ValidadorDeCurriculo())'
    - '        .adicionar(NormalizadorDeCampos())'
    - '        .adicionar(FiltroPorExperienciaMinima(vaga))'
    - '        .adicionar(FiltroPorPretensaoSalarial(vaga))'
    - '        .adicionar(CalculadorDeScore(vaga))'
    - '        .adicionar(relatorio)'
    anotacoes:
    - linha: 36
      texto: Deixa nomes e habilidades num formato único, antes do cálculo de score.
  - tipo: conceito
    titulo: Estado compartilhado invisível
    texto: O anti-padrão de Pipes and Filters é o filtro que guarda estado interno sem declarar, como um total acumulado entre
      chamadas. O resultado passa a depender da ordem de execução e o fluxo deixa de ser previsível. Quando o fluxo precisa
      acumular, o estado vai para um armazenamento externo declarado.
  - tipo: conceito
    titulo: Microkernel
    texto: 'Microkernel separa um núcleo estável das extensões variáveis. O núcleo contém só o mínimo para o sistema funcionar:
      o registro, que guarda quais plugins existem, e a orquestração, que decide a ordem de execução. Plugin é uma extensão
      que implementa o contrato definido pelo núcleo. O núcleo não sabe o que os plugins fazem, e os plugins não se conhecem.
      Richards e Ford chamam o estilo de Plug-in Architecture.'
    analogia: 'Um videogame com cartuchos: o console é fixo e cada cartucho acrescenta um jogo.'
  - tipo: diagrama
    id: D-02
    tipo_diagrama: Estrutura
    titulo: Núcleo e plugins do faturamento
    mermaid: "flowchart TD\n    subgraph nucleo[\"nucleo.py\"]\n        REG[\"Registro\"] --> NUC[\"Nucleo\\nimpostos, frete,\
      \ notificacao\"]\n    end\n    NUC -->|\"contrato Plugin\"| SP[\"impostos_sp.py\"]\n    NUC --> RJ[\"impostos_rj.py\"\
      ]\n    NUC --> FR[\"frete.py\"]\n    NUC --> NT[\"notificacao.py\"]\n    NUC -. \"plugin novo\" .-> MG[\"impostos_mg.py\"\
      ]"
  - tipo: editor
    rotulo: arquivo
    caminho: codigo/oda-02/microkernel/nucleo.py
    commit: bd84630
    contexto: O arquivo `nucleo.py` contém o contrato de plugin, o registro e o núcleo. Não há nenhuma menção a ICMS, ISS
      ou a qualquer estado neste arquivo.
    inicio: 10
    linhas:
    - ORDEM_CATEGORIAS = ("impostos", "frete", "notificacao")
    - ''
    - ''
    - 'class Plugin:'
    - '    """O contrato de extensão. Mudá-lo obriga todos os plugins a mudar."""'
    - ''
    - '    nome: str = ""'
    - '    categoria: str = ""'
    - ''
    - '    def aplica_se(self, fatura: Fatura) -> bool:'
    - '        return True'
    - ''
    - '    def executar(self, fatura: Fatura) -> None:'
    - '        raise NotImplementedError'
    anotacoes:
    - linha: 10
      texto: O núcleo conhece só as categorias e a ordem em que elas executam.
    - linha: 19
      texto: Cada plugin decide se vale para a fatura, por exemplo pelo estado do cliente.
  - tipo: editor
    rotulo: arquivo
    caminho: codigo/oda-02/microkernel/plugins/impostos_rj.py
    commit: bd84630
    contexto: O arquivo `plugins/impostos_rj.py` é um plugin completo. Toda a regra tributária do Rio de Janeiro está nele.
    inicio: 9
    linhas:
    - 'class IcmsRJ(Plugin):'
    - '    nome = "ICMS-RJ"'
    - '    categoria = "impostos"'
    - ''
    - '    def aplica_se(self, fatura: Fatura) -> bool:'
    - '        return fatura.estado == "RJ"'
    - ''
    - '    def executar(self, fatura: Fatura) -> None:'
    - '        base = sum(i.total for i in fatura.itens if i.categoria == "eletronico")'
    - '        if base:'
    - '            fatura.ajustes.append(("ICMS-RJ", base * ALIQUOTA_ICMS))'
  - tipo: conceito
    titulo: Core creep
    texto: Core creep é o anti-padrão em que o núcleo acumula regras que pertencem aos plugins, em geral como uma sequência
      de `if` por estado, cliente ou região. Cada variação nova obriga a alterar, testar e implantar o núcleo, e a extensibilidade
      do estilo desaparece. O arquivo abaixo é um contraexemplo mantido só para leitura.
  - tipo: editor
    rotulo: arquivo
    caminho: codigo/oda-02/microkernel/nucleo_com_creep.py
    commit: bd84630
    contexto: O arquivo `nucleo_com_creep.py` não é usado pelo programa. Ele mostra como o núcleo ficaria se a regra de cada
      estado fosse escrita dentro dele.
    inicio: 11
    linhas:
    - 'class NucleoComCreep:'
    - '    def processar(self, fatura: Fatura) -> None:'
    - '        eletronicos = sum(i.total for i in fatura.itens if i.categoria == "eletronico")'
    - '        if fatura.estado == "SP":'
    - '            fatura.ajustes.append(("ICMS-SP", eletronicos * 0.18))'
    - '        elif fatura.estado == "RJ":'
    - '            fatura.ajustes.append(("ICMS-RJ", eletronicos * 0.20))'
    - '        # Minas Gerais exigiria mais um elif aqui, dentro do núcleo.'
    anotacoes:
    - linha: 16
      texto: 'Regra de plugin dentro do núcleo: cada estado novo é mais um elif.'
  - tipo: comparativo
    colunas:
    - Pipes and Filters
    - Microkernel
    linhas:
    - dimensao: Acomoda mudança por
      valores:
      - Inclusão, remoção ou troca de filtros
      - Inclusão de plugins
    - dimensao: Parte estável
      valores:
      - O contrato de filtro e o encadeador
      - O núcleo e o contrato de plugin
    - dimensao: Anti-padrão
      valores:
      - Estado compartilhado invisível
      - Core creep
    - dimensao: Testabilidade (1 a 5)
      valores:
      - '5'
      - '3'
    - dimensao: Modularidade (1 a 5)
      valores:
      - '5'
      - '4'
    - dimensao: Desempenho (1 a 5)
      valores:
      - '2'
      - '3'
  - tipo: conceito
    titulo: ADR, o registro da escolha
    texto: ADR é a sigla de Architecture Decision Record, ou registro de decisão arquitetural. É um documento curto, versionado
      junto com o código, que guarda o contexto, a decisão, as alternativas consideradas e as consequências. O bloco abaixo
      é um ADR de exemplo para o faturamento desta ODA. Clique nele para abrir.
  - tipo: adr
    id: ADR-002
    titulo: Calcular impostos por estado com Microkernel
    status: Aceita (exemplo didático)
    contexto: 'O faturamento atende clientes de vários estados, e cada estado tem regras tributárias próprias que mudam com
      frequência. O fluxo de cálculo é o mesmo para todos: impostos, depois frete, depois notificação.'
    decisao: Manter no núcleo apenas o registro e a ordem das categorias, e implementar a regra de cada estado como um plugin
      que cumpre o contrato Plugin.
    alternativas: Condicionais por estado dentro do núcleo, descartadas porque cada estado novo exigiria alterar e implantar
      o núcleo. Pipes and Filters, descartado porque o problema central é a variação por estado e não uma sequência de transformações
      de dados.
    consequencias: Um estado novo entra por um arquivo em plugins e uma linha de registro. O contrato Plugin passa a exigir
      estabilidade, porque mudá-lo obriga todos os plugins a mudar.
  - tipo: faixa
    estilo: dica
    titulo: 📚 No material oficial
    texto: 'Os conceitos desta aba seguem a página Padrões e decisões do Módulo 1, nas seções Pipes and Filters, Microkernel,
      O caso canônico: cálculo de impostos e ADR. As notas de 1 a 5 do comparativo vêm das tabelas de características arquiteturais
      dessas seções, que seguem Richards e Ford.'
    links:
    - *id002
    - *id003
    - &id006
      rotulo: 'Material oficial · O caso canônico: cálculo de impostos'
      url: https://marco-mendes.github.io/arquitetura-software/modulo-1-visao-geral/padroes-e-decisoes/#o-caso-canonico-calculo-de-impostos
    - *id001
    - &id007
      rotulo: Material oficial · Template de ADR
      url: https://marco-mendes.github.io/arquitetura-software/referencia/template-adr/
- id: laboratorio
  titulo: Laboratório
  blocos:
  - tipo: legenda
    texto: Você vai executar quatro programas prontos e comparar as saídas em pares. Nenhum arquivo precisa ser alterado.
      Reserve 12 minutos, cerca de 3 por programa.
  - tipo: glossario
    titulo: 📘 Conceitos usados nesta aba
    texto: Os termos técnicos desta aba estão explicados abaixo, na ordem em que aparecem.
    itens:
    - termo: Terminal
      definicao: Programa em que você digita comandos de texto. No Windows é o PowerShell, no macOS e no Linux é o Terminal.
        O VS Code abre um terminal integrado pelo menu Terminal, opção Novo Terminal.
    - termo: cd
      definicao: Comando que muda a pasta atual do terminal. Os programas Python desta ODA precisam ser executados de dentro
        da própria pasta.
    - termo: Filtro e pipeline
      definicao: Filtro é uma etapa que recebe um item e o devolve ou descarta. Pipeline é a sequência de filtros.
    - termo: Score
      definicao: Percentual das habilidades exigidas pela vaga que o candidato informou, calculado pelo `CalculadorDeScore`.
    - termo: Núcleo e plugin
      definicao: O núcleo é a parte estável, que conhece a ordem das categorias. O plugin é a extensão que traz a regra de
        um estado.
  - tipo: faixa
    estilo: objetivo
    problema: Na triagem, um filtro depende do formato que outro filtro produz. No faturamento, a regra de cada estado poderia
      acabar dentro do núcleo como mais uma condicional.
    impacto: Retirar ou reordenar um filtro sem conhecer essa dependência muda o resultado sem nenhum erro. Regras de estado
      no núcleo obrigam a alterar e implantar o núcleo a cada estado novo.
    mecanismo: A variante `sem_normalizador.py` monta o pipeline com os mesmos filtros, exceto o normalizador. O programa
      `com_minas_gerais.py` registra o plugin novo `plugins/impostos_mg.py` sem alterar `nucleo.py`.
    comprovacao: Sem o normalizador, Ana Lima cai de 100% para 0% de score. A fatura de Minas Gerais recebe ICMS-MG de R$900.00,
      e `nucleo.py` continua sem nenhuma menção a MG.
  - tipo: faixa
    estilo: dica
    titulo: 💻 Windows, macOS e Linux
    texto: Os comandos usam `python3`, que é o nome do interpretador no macOS e no Linux. No Windows, use `py` no lugar de
      `python3`, por exemplo `py main.py`. O comando `cd` funciona igual no PowerShell, inclusive com a barra `/` nos caminhos.
  - tipo: passos
    itens:
    - titulo: Abrir o terminal na raiz do repositório
      texto: No VS Code, abra a pasta `odas-arquitetura-software` e depois um terminal pelo menu Terminal, opção Novo Terminal.
        Atualize o repositório antes de começar.
      editor:
        rotulo: terminal
        linhas:
        - git pull
    - titulo: Executar a triagem completa
      texto: Entre na pasta da triagem e execute o pipeline. Observe as três linhas de descarte e reprovação, cada uma impressa
        por um tester diferente, e o score de cada aprovado.
      editor:
        rotulo: terminal
        linhas:
        - cd codigo/oda-02/pipes-and-filters
        - python3 main.py
  - tipo: editor
    rotulo: saida
    origem: executado
