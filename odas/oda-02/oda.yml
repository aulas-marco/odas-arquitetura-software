    - '     Score: ██████████ 100%'
    - '     Habilidades compatíveis: python, postgresql, rest, docker'
    - '     Experiência: 7 ano(s) | Pretensão: R$17,000'
    - '     Cidade: Porto Alegre'
    - ''
    - '  3. Felipe Nunes'
