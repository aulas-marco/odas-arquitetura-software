  - tipo: faixa
    estilo: erro
    sintoma: 'O terminal mostra `ModuleNotFoundError: No module named ''ariadne''`.'
    causa: O ambiente virtual não está ativado no terminal em uso, ou as bibliotecas da ODA não foram instaladas nele.
    correcao: Volte à raiz do repositório, ative o ambiente com `source .venv/bin/activate` e execute `pip install -r codigo/oda-04/requirements.txt`.
  - tipo: faixa
    estilo: erro
    sintoma: O `pip install` termina com `No matching distribution found`.
    causa: O Python do ambiente virtual é anterior à versão 3.11, que é a versão mínima das bibliotecas desta ODA.
    correcao: Confira a versão com `python --version`, instale o Python 3.13 pelo procedimento do Módulo 0, apague a pasta
      `.venv` e crie o ambiente de novo.
  - tipo: checklist
    titulo: Checklist final
    itens:
    - As seis operações GraphQL usaram o endereço `POST /graphql`.
    - O resolver da operadora executou três vezes na consulta da lista.
    - O protocolo `ELG-999` devolveu `null` com status `200`.
    - Na Cena 2, o servidor registrou zero conexões abertas na mudança para `elegivel`.
