  - tipo: faixa
    estilo: quebra
    texto: Na Cena 1, o painel e o aplicativo receberam `em_analise` sem enviar nova requisição. Na Cena 2, a mudança para
      `elegivel` ocorreu com zero conexões abertas, e o painel só conheceu a situação nova pelo estado atual enviado na reconexão.
  - tipo: faixa
    estilo: dica
    titulo: 🖥️ Terminal simulado
    texto: Quem não conseguiu preparar o ambiente pode digitar os comandos nos terminais simulados abaixo. As saídas simuladas
      são as saídas reais dos programas no commit citado na aba Objetivo.
  - tipo: terminal
    titulo: terminal simulado · pasta codigo/oda-04/graphql
    comandos:
    - entrada: python demo.py
      saida: "--- Consulta do aplicativo móvel\nPOST /graphql -> 200 (50 bytes na resposta)\n{\n  \"data\": {\n    \"elegibilidade\"\
        : {\n      \"situacao\": \"recebida\"\n    }\n  }\n}\n\n--- Consulta do painel administrativo\n  [resolver] cadastro\
        \ de operadoras consultado para OPS-001\nPOST /graphql -> 200 (165 bytes na resposta)\n{\n  \"data\": {\n    \"elegibilidade\"\
        : {\n      \"protocolo\": \"ELG-001\",\n      \"situacao\": \"recebida\",\n      \"criadoEm\": \"2026-07-17T13:30:00Z\"\
        ,\n      \"operadora\": {\n        \"nome\": \"Saúde Mais\",\n        \"prazoRespostaHoras\": 24\n      }\n    }\n\
        \  }\n}\n\n--- Lista com a operadora de cada elegibilidade\n  [resolver] cadastro de operadoras consultado para OPS-001\n\
        \  [resolver] cadastro de operadoras consultado para OPS-002\n  [resolver] cadastro de operadoras consultado para\
        \ OPS-001\nPOST /graphql -> 200 (205 bytes na resposta)\n{\n  \"data\": {\n    \"elegibilidades\": [\n      {\n  \
        \      \"protocolo\": \"ELG-001\",\n        \"operadora\": {\n          \"nome\": \"Saúde Mais\"\n        }\n    \
        \  },\n      {\n        \"protocolo\": \"ELG-002\",\n        \"operadora\": {\n          \"nome\": \"Vida Plena\"\n\
        \        }\n      },\n      {\n        \"protocolo\": \"ELG-003\",\n        \"operadora\": {\n          \"nome\":\
        \ \"Saúde Mais\"\n        }\n      }\n    ]\n  }\n}\n\n--- Protocolo inexistente\nPOST /graphql -> 200 (31 bytes na\
        \ resposta)\n{\n  \"data\": {\n    \"elegibilidade\": null\n  }\n}\n\n--- Campo inexistente no schema\nPOST /graphql\
        \ -> 400 (125 bytes na resposta)\n{\n  \"errors\": [\n    {\n      \"message\": \"Cannot query field 'senhaDoPaciente'\
        \ on type 'Elegibilidade'.\",\n      \"locations\": [\n        {\n          \"line\": 1,\n          \"column\": 50\n\
        \        }\n      ]\n    }\n  ]\n}\n\n--- Mutation que solicita uma elegibilidade\nPOST /graphql -> 200 (81 bytes\
        \ na resposta)\n{\n  \"data\": {\n    \"solicitarElegibilidade\": {\n      \"protocolo\": \"ELG-004\",\n      \"situacao\"\
        : \"recebida\"\n    }\n  }\n}"
