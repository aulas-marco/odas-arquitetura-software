- id: verificacao
  titulo: Verificação
  blocos:
  - tipo: legenda
    texto: As perguntas abaixo tratam do conteúdo do Módulo 2 do material oficial. Cada alternativa exibe uma explicação depois
      da escolha.
  - tipo: quiz
    perguntas:
    - enunciado: Numa API GraphQL, o que a consulta enviada pelo consumidor define?
      alternativas:
      - texto: Quais campos do schema ele quer receber.
        correta: true
        explicacao: A consulta escolhe entre os tipos e campos declarados no schema.
      - texto: Qual URI do recurso será chamada.
        correta: false
        explicacao: Todas as operações vão ao mesmo endereço.
      - texto: Qual número de campo será usado na mensagem binária.
        correta: false
        explicacao: Números de campo pertencem ao Protocol Buffers do gRPC.
    - enunciado: Para qual endereço vão as operações GraphQL no exemplo do material oficial?
      alternativas:
      - texto: Para o endereço único `POST /graphql`, com a operação indicada no corpo da requisição.
        correta: true
        explicacao: O corpo diz se a operação é query ou mutation.
      - texto: Para uma URI por tipo do schema.
        correta: false
        explicacao: Uma URI por recurso é característica do REST.
      - texto: Para uma conexão aberta por consumidor.
        correta: false
        explicacao: Conexão aberta por cliente é característica do WebSocket.
    - enunciado: Qual é a diferença entre query e mutation?
      alternativas:
      - texto: A query lê dados e a mutation altera dados.
        correta: true
        explicacao: As duas escolhem os campos da resposta.
      - texto: A query usa GET e a mutation usa WebSocket.
        correta: false
        explicacao: As duas vão ao mesmo endereço HTTP no exemplo.
      - texto: A mutation não tem resposta.
        correta: false
        explicacao: A mutation do exemplo devolve `protocolo` e `situacao`.
    - enunciado: Quando um resolver executa?
      alternativas:
      - texto: Quando a consulta pede o campo associado a ele.
        correta: true
        explicacao: Na consulta do aplicativo, que pediu só a situação, o resolver da operadora não executou.
      - texto: Uma vez por requisição, sempre.
        correta: false
        explicacao: Na lista de três elegibilidades, o resolver da operadora executou três vezes.
      - texto: Somente em mutations.
        correta: false
        explicacao: Resolvers também produzem os campos das queries.
    - enunciado: O que é o problema N+1 e qual é a mitigação usual citada no material?
      alternativas:
      - texto: Uma consulta com N itens dispara N consultas adicionais, mitigadas pelo agrupamento das buscas que o DataLoader
          faz.
        correta: true
        explicacao: No exemplo, a lista de três elegibilidades consultou o cadastro de operadoras três vezes.
      - texto: Uma consulta repetida N vezes pelo cliente, mitigada pelo cache HTTP.
        correta: false
        explicacao: O efeito ocorre dentro da execução de uma única consulta.
      - texto: Um schema que cresce N vezes a cada versão, mitigado pelo versionamento da URI.
        correta: false
        explicacao: O problema N+1 trata do número de buscas feitas durante a execução de uma consulta.
    - enunciado: Uma consulta pede um campo que o schema não declara. O que acontece?
      alternativas:
      - texto: A consulta é recusada antes de qualquer resolver executar.
        correta: true
        explicacao: No exemplo, a resposta foi `400` com a lista de erros.
      - texto: O campo volta com o valor null.
        correta: false
        explicacao: O `null` aparece para um protocolo inexistente num campo declarado.
      - texto: O resolver mais próximo é executado.
        correta: false
        explicacao: A validação contra o schema acontece antes da execução.
    - enunciado: Qual cuidado arquitetural o material oficial associa ao GraphQL?
      alternativas:
      - texto: Custo, autorização e cache nos resolvers.
        correta: true
        explicacao: O GraphQL também exige política para consultas caras.
      - texto: Reconexão, ordenação e pressão de consumo.
        correta: false
        explicacao: Esses cuidados pertencem ao WebSocket.
      - texto: Isolar a tradução do domínio.
        correta: false
        explicacao: Esse cuidado pertence ao SOAP com parceiros legados.
    - enunciado: Como começa uma conexão WebSocket, segundo a RFC 6455?
      alternativas:
      - texto: 'Com uma requisição HTTP com o cabeçalho `Upgrade: websocket`, respondida com `101 Switching Protocols`.'
        correta: true
        explicacao: Depois da resposta, as duas pontas enviam mensagens a qualquer momento.
      - texto: Com uma chamada gRPC de fluxo contínuo.
        correta: false
        explicacao: O gRPC é outro protocolo.
      - texto: Com um `POST /graphql` que mantém a resposta aberta.
        correta: false
        explicacao: O GraphQL do exemplo usa requisição e resposta.
    - enunciado: A situação muda enquanto nenhum cliente está conectado ao WebSocket. O que o material oficial conclui?
      alternativas:
      - texto: A mensagem não é guardada. A garantia de entrega de cada transição exige um mecanismo durável de mensageria.
        correta: true
        explicacao: No exemplo, o painel conheceu a situação nova pelo estado atual enviado na reconexão.
      - texto: O WebSocket guarda a mensagem e a entrega na reconexão.
        correta: false
        explicacao: O WebSocket não guarda mensagens para entrega posterior.
      - texto: O servidor recusa a mudança até um cliente se conectar.
        correta: false
        explicacao: A situação muda no servidor mesmo sem conexões abertas.
    - enunciado: O serviço WebSocket passa a rodar em várias instâncias. Que necessidade aparece?
      alternativas:
      - texto: A mudança precisa circular entre as instâncias por um canal compartilhado.
        correta: true
        explicacao: A instância que recebe a resposta da operadora pode não ser a que mantém a conexão do painel.
      - texto: Cada cliente precisa abrir uma conexão com todas as instâncias.
        correta: false
        explicacao: O material oficial não propõe essa solução.
      - texto: O WebSocket precisa ser trocado por REST.
        correta: false
        explicacao: A necessidade é de comunicação entre as instâncias.
  - tipo: resumo
  - tipo: checklist
    titulo: Para revisar depois da aula
    itens:
    - Ler a tabela Comparação dos quatro estilos no caso hospitalar e relacionar cada linha às ODAs 03 e 04.
    - Ler a seção Além do HTTP da página de conceitos e a tabela de cuidados de cada estilo.
  - tipo: faixa
    estilo: dica
    titulo: 📚 No material oficial
    texto: Os links abaixo levam às seções do material oficial cobertas pelas perguntas.
    links:
    - rotulo: Material oficial · Seleção de campos com GraphQL
      url: https://marco-mendes.github.io/arquitetura-software/modulo-2-apis/exemplo-arquitetural/#selecao-de-campos-com-graphql
    - rotulo: Material oficial · Aviso de mudança por WebSocket
      url: https://marco-mendes.github.io/arquitetura-software/modulo-2-apis/exemplo-arquitetural/#aviso-de-mudanca-por-websocket
    - rotulo: Material oficial · Além do HTTP, estilos de APIs
      url: https://marco-mendes.github.io/arquitetura-software/modulo-2-apis/conceitos/#alem-do-http-estilos-de-apis
    - rotulo: Material oficial · Comparação dos quatro estilos
      url: https://marco-mendes.github.io/arquitetura-software/modulo-2-apis/exemplo-arquitetural/#comparacao-dos-quatro-estilos-no-caso-hospitalar
