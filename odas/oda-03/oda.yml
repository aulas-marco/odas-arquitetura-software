      url: https://marco-mendes.github.io/arquitetura-software/modulo-2-apis/exemplo-arquitetural/#elegibilidade-como-recurso-rest
    - rotulo: Material oficial · Elegibilidade como operação gRPC
      url: https://marco-mendes.github.io/arquitetura-software/modulo-2-apis/exemplo-arquitetural/#elegibilidade-como-operacao-grpc
    - rotulo: Material oficial · Comparação dos quatro estilos
      url: https://marco-mendes.github.io/arquitetura-software/modulo-2-apis/exemplo-arquitetural/#comparacao-dos-quatro-estilos-no-caso-hospitalar
- id: verificacao
  titulo: Verificação
  blocos:
  - tipo: legenda
    texto: As perguntas abaixo tratam do conteúdo do Módulo 2 do material oficial. Cada alternativa exibe uma explicação depois
      da escolha.
  - tipo: quiz
    perguntas:
    - enunciado: Segundo o material oficial, de que o consumidor de uma API depende?
      alternativas:
      - texto: Do contrato publicado, sem acesso ao código nem ao banco.
        correta: true
        explicacao: Por isso trocar biblioteca ou armazenamento pode ser uma mudança interna.
      - texto: Do código-fonte da implementação.
        correta: false
        explicacao: A implementação diz como a promessa é cumprida hoje e pode mudar sem aviso ao consumidor.
      - texto: Do esquema do banco de dados do provedor.
        correta: false
        explicacao: A API encapsula tabelas e algoritmos internos.
    - enunciado: O que a resposta `202 Accepted` de `POST /elegibilidades` informa ao consumidor?
      alternativas:
      - texto: Que o pedido foi aceito, sem afirmar que a operadora já decidiu.
        correta: true
        explicacao: O cabeçalho `Location` indica onde acompanhar o recurso aceito.
      - texto: Que a elegibilidade foi aprovada.
        correta: false
        explicacao: A situação `recebida` não quer dizer aprovada.
      - texto: Que o recurso foi criado e já tem o estado final.
        correta: false
        explicacao: O pedido ainda aguarda a decisão da operadora, situação que o código `201` não descreve.
    - enunciado: Uma rota `/aprovarAutomaticamente` recebe JSON sobre HTTP. Como o material oficial classifica essa rota?
      alternativas:
      - texto: Como uma operação RPC coerente, que não deve ser chamada de REST só por usar JSON e HTTP.
        correta: true
        explicacao: Uma API HTTP não é automaticamente REST.
      - texto: Como REST, porque usa HTTP.
        correta: false
        explicacao: REST não é JSON sobre HTTP.
      - texto: Como GraphQL, porque recebe JSON.
        correta: false
        explicacao: GraphQL é caracterizado por schema e seleção de campos.
    - enunciado: A operadora externa continua lenta. O que o material oficial diz sobre trocar REST por gRPC nesse caso?
      alternativas:
      - texto: O gRPC não resolve por si só a lentidão da dependência externa.
        correta: true
        explicacao: O arquiteto registra a força que levou à escolha e a evidência que poderá revisá-la.
      - texto: O gRPC elimina a lentidão porque usa mensagem binária.
        correta: false
        explicacao: Mensagem menor não acelera a resposta da operadora.
      - texto: O gRPC elimina a lentidão porque usa HTTP/2.
        correta: false
        explicacao: O transporte não altera o tempo de decisão da operadora.
    - enunciado: Em que arquivo fica o contrato de um serviço gRPC?
      alternativas:
      - texto: Num arquivo `.proto`, escrito na linguagem do Protocol Buffers.
        correta: true
        explicacao: O arquivo declara o serviço, as operações e as mensagens.
      - texto: Num arquivo `openapi.yaml`.
        correta: false
        explicacao: OpenAPI descreve o contrato de APIs HTTP como a API REST do laboratório.
      - texto: No código do servidor, sem arquivo separado.
        correta: false
        explicacao: O código do cliente e o do servidor são gerados a partir do contrato.
    - enunciado: Por que trocar o número de um campo do `.proto` quebra consumidores antigos?
      alternativas:
      - texto: Porque a mensagem binária identifica cada campo pelo número, sem transmitir o nome do campo.
        correta: true
        explicacao: Pelo mesmo motivo, a renomeação de um campo preserva a compatibilidade.
      - texto: Porque o gRPC proíbe alterações no `.proto`.
        correta: false
        explicacao: O contrato pode evoluir, com campos novos e renomeações compatíveis.
      - texto: Porque o número define a ordem de execução das operações.
        correta: false
        explicacao: O número identifica o campo dentro da mensagem.
    - enunciado: O que contém o arquivo `elegibilidade_pb2_grpc.py`, gerado pelo `protoc`?
      alternativas:
      - texto: O stub do cliente e a classe base do servidor.
        correta: true
        explicacao: As classes das mensagens ficam em `elegibilidade_pb2.py`.
      - texto: Somente as classes das mensagens.
        correta: false
        explicacao: As mensagens ficam no outro arquivo gerado.
      - texto: A regra de validação dos onze dígitos.
        correta: false
        explicacao: Essa regra é escrita à mão no servidor.
    - enunciado: Como o serviço gRPC do exemplo comunica que um protocolo não existe?
      alternativas:
      - texto: Com o status `NOT_FOUND`, da tabela própria de status do gRPC.
        correta: true
        explicacao: O gRPC não usa os códigos de status do HTTP para o resultado da operação.
      - texto: Com o código HTTP `404`.
        correta: false
        explicacao: O `404` é a resposta da API REST para o mesmo caso.
      - texto: Com uma mensagem vazia e sucesso.
        correta: false
        explicacao: O servidor encerra a chamada com status de erro.
    - enunciado: No exemplo gRPC, onde fica a regra de que o `cpf` tem onze dígitos?
      alternativas:
      - texto: No código do servidor, porque o Protocol Buffers declara tipos sem padrões de texto.
        correta: true
        explicacao: No REST, a mesma regra vinha do `Field(pattern=...)` do Pydantic.
      - texto: No `.proto`, numa anotação de padrão.
        correta: false
        explicacao: O `.proto` do exemplo declara apenas o tipo `string`.
      - texto: No stub do cliente.
        correta: false
        explicacao: O stub é código gerado a partir do contrato, sem regras de negócio.
    - enunciado: Que exigência aparece quando um navegador precisa chamar um serviço gRPC?
      alternativas:
      - texto: O uso da variante gRPC-Web e de um proxy na borda.
        correta: true
        explicacao: Um navegador não chama um serviço gRPC diretamente.
      - texto: A conversão do `.proto` para OpenAPI.
        correta: false
        explicacao: O material oficial não cita essa conversão.
      - texto: A troca do HTTP/2 por WebSocket.
        correta: false
        explicacao: WebSocket é outro estilo de interação.
  - tipo: resumo
  - tipo: checklist
    titulo: Para revisar depois da aula
    itens:
    - Ler a seção Além do HTTP da página de conceitos e a tabela de cuidados de cada estilo.
    - Comparar o `.proto` desta ODA com o `openapi.yaml` da Oficina de ferramentas do Módulo 2.
  - tipo: faixa
    estilo: dica
    titulo: 📚 No material oficial
    texto: Os links abaixo levam às seções do material oficial cobertas pelas perguntas.
    links:
    - rotulo: Material oficial · API como fronteira de colaboração
      url: https://marco-mendes.github.io/arquitetura-software/modulo-2-apis/conceitos/#api-como-fronteira-de-colaboracao
    - rotulo: Material oficial · A semântica do HTTP
      url: https://marco-mendes.github.io/arquitetura-software/modulo-2-apis/conceitos/#exemplo-a-semancia-do-http
    - rotulo: Material oficial · Restrições REST de Fielding
      url: https://marco-mendes.github.io/arquitetura-software/modulo-2-apis/conceitos/#restricoes-rest-de-fielding
    - rotulo: Material oficial · Além do HTTP, estilos de APIs
      url: https://marco-mendes.github.io/arquitetura-software/modulo-2-apis/conceitos/#alem-do-http-estilos-de-apis
    - rotulo: Material oficial · Elegibilidade como operação gRPC
      url: https://marco-mendes.github.io/arquitetura-software/modulo-2-apis/exemplo-arquitetural/#elegibilidade-como-operacao-grpc
