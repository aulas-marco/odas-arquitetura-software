id: '01'
titulo: Camadas e monólito modular
abas:
- id: objetivo
  titulo: Objetivo
  blocos:
  - tipo: legenda
    texto: Esta ODA apresenta dois estilos de organização interna de um backend por meio de programas Python prontos para
      execução. A atividade dura 25 minutos distribuídos entre as quatro abas.
  - tipo: glossario
    texto: Os termos abaixo aparecem nas abas desta ODA na ordem em que surgem. Cada aba repete a explicação do termo no primeiro
      uso, porque o aluno pode abrir qualquer aba diretamente.
    itens:
    - termo: Estilo arquitetural
      definicao: Forma conhecida de organizar as partes de um sistema e as regras de dependência entre elas. Camadas e monólito
        modular são estilos arquiteturais.
      referencia:
        rotulo: Material oficial · Estilos arquiteturais
        url: https://marco-mendes.github.io/arquitetura-software/modulo-1-visao-geral/conceitos/#estilos-arquiteturais
    - termo: Camada
      definicao: Grupo de código com uma única responsabilidade técnica. O estilo em camadas define quais camadas cada camada
        pode chamar.
    - termo: Regra de negócio
      definicao: Condição exigida pelo negócio que vale para qualquer tecnologia adotada. Na agenda clínica desta ODA, a regra
        proíbe duas consultas do mesmo médico em horários sobrepostos.
    - termo: HTTP 201 e HTTP 409
      definicao: Códigos de resposta do protocolo HTTP. O código 201 informa a criação de um recurso, e o código 409 informa
        que o pedido conflita com o estado atual do recurso.
      referencia:
        rotulo: MDN · Códigos de status HTTP
        url: https://developer.mozilla.org/pt-BR/docs/Web/HTTP/Status
    - termo: Unidade de implantação
      definicao: Pacote de software colocado em produção numa única operação. Um monólito tem exatamente uma unidade de implantação.
    - termo: Módulo
      definicao: Parte de um monólito modular que reúne o código e os dados de uma capacidade de negócio, como a Agenda ou
        o Faturamento.
    - termo: Contrato público
      definicao: Conjunto de funções e tipos que um módulo oferece aos demais módulos. Nesta ODA o contrato da Agenda é o
        arquivo `agenda/api.py`.
    - termo: ADR (Architecture Decision Record)
      definicao: Registro de decisão arquitetural. É um documento curto e versionado que registra uma escolha de arquitetura
        e os motivos dela.
      referencia: &id001
        rotulo: Material oficial · ADR
        url: https://marco-mendes.github.io/arquitetura-software/modulo-1-visao-geral/padroes-e-decisoes/#adr-o-mecanismo-para-escolher-estilos
  - tipo: checklist
    titulo: Ao concluir, você poderá
    itens:
    - Distinguir a responsabilidade da camada de serviço da responsabilidade da camada de domínio.
    - Explicar por que um módulo deve consumir o contrato público de outro módulo.
    - Interpretar a saída de um verificador de fronteiras entre módulos.
    - Ler um ADR que registra a escolha entre os dois estilos.
  - tipo: faixa
    estilo: dica
    titulo: 🧭 Como ter o código na sua máquina
    texto: O código desta ODA está na pasta `codigo/` do repositório `odas-arquitetura-software`. Quem concluiu o Módulo 0
      já tem o repositório clonado e precisa apenas executar `git pull` dentro da pasta dele. Os caminhos de arquivo citados
      nas abas partem da raiz do repositório, e os trechos exibidos correspondem ao commit `e81982a`.
    links:
    - rotulo: 'Módulo 0: preparação do ambiente'
      url: https://aulas-marco.github.io/odas-arquitetura-software/modulo-0/
    - rotulo: Repositório no GitHub, commit e81982a
      url: https://github.com/aulas-marco/odas-arquitetura-software/tree/e81982a
  - tipo: faixa
    estilo: dica
    titulo: 📚 No material oficial
    texto: Os links abaixo levam às seções do material oficial cobertas por esta ODA. O código da pasta `camadas/` é cópia
      do código do Experimento 1 da Oficina de ferramentas.
    links:
    - &id002
      rotulo: Material oficial · Camadas
      url: https://marco-mendes.github.io/arquitetura-software/modulo-1-visao-geral/padroes-e-decisoes/#camadas
    - &id003
      rotulo: Material oficial · Monólito modular
      url: https://marco-mendes.github.io/arquitetura-software/modulo-1-visao-geral/padroes-e-decisoes/#monolito-modular-uma-implantacao-capacidades-com-autonomia-interna
    - *id001
    - &id004
      rotulo: Material oficial · Oficina, Experimento 1
      url: https://marco-mendes.github.io/arquitetura-software/modulo-1-visao-geral/oficina-de-ferramentas/#experimento-1-camadas-agenda-clinica-30-minutos
- id: conceitos
  titulo: Conceitos
  blocos:
  - tipo: legenda
    texto: Esta aba retoma os conceitos expostos em aula e associa cada conceito a um trecho do código. Os trechos servem
      de referência durante o Laboratório.
  - tipo: faixa
    estilo: dica
    titulo: 📂 Onde está o código
    texto: Os arquivos desta aba ficam em `codigo/oda-01/camadas/` e `codigo/oda-01/monolito-modular/` no repositório `odas-arquitetura-software`,
      e o botão Ver no GitHub de cada trecho abre o arquivo completo no navegador. No VS Code, o atalho Ctrl+P (Cmd+P no macOS)
      localiza qualquer arquivo pelo caminho exibido no trecho.
    links:
    - rotulo: Repositório no GitHub, commit e81982a
      url: https://github.com/aulas-marco/odas-arquitetura-software/tree/e81982a
  - tipo: conceito
    titulo: Estilo arquitetural
    texto: Estilo arquitetural é uma forma conhecida de organizar as partes de um sistema e as regras de dependência entre
      elas. Camadas e monólito modular pertencem à família de organização interna, que trata da colaboração entre responsabilidades
      dentro de uma única aplicação.
  - tipo: conceito
    titulo: Camadas
    texto: No estilo em camadas, cada camada tem uma responsabilidade técnica e pode chamar apenas as camadas permitidas.
      A agenda clínica desta ODA tem quatro camadas, cada uma num arquivo da pasta `camadas/`, conforme a tabela abaixo.
  - tipo: comparativo
    colunas:
    - Arquivo
    - Responsabilidade
    linhas:
    - dimensao: Apresentação
      valores:
      - '`apresentacao.py`'
      - Converte chamadas e erros em códigos HTTP
    - dimensao: Serviço
      valores:
      - '`servicos.py`'
      - Coordena o caso de uso e delega a decisão ao domínio
    - dimensao: Domínio
      valores:
      - '`dominio.py`'
      - Guarda as regras de negócio, como a regra de conflito de horários
    - dimensao: Repositório
      valores:
      - '`repositorios.py`'
      - Guarda e recupera as consultas
  - tipo: diagrama
    id: D-01
    tipo_diagrama: Dependências entre camadas
    titulo: Camadas da agenda clínica
    mermaid: "flowchart TB\n    A[\"apresentacao.py<br/>códigos HTTP\"] --> S[\"servicos.py<br/>caso de uso\"]\n    S -->\
      \ D[\"dominio.py<br/>regra de conflito\"]\n    S --> R[\"repositorios.py<br/>armazenamento\"]\n    A -. \"atalho proibido\"\
      \ .-> R"
  - tipo: conceito
    titulo: Regra de negócio e invariante
    texto: Regra de negócio é uma condição exigida pelo negócio que vale para qualquer tecnologia adotada. A regra que precisa
      valer em todos os estados do sistema recebe o nome de invariante. Na agenda clínica, a invariante proíbe duas consultas
      sobrepostas para o mesmo médico, e o método `conflita_com` da camada de domínio a implementa.
  - tipo: editor
    rotulo: arquivo
    caminho: codigo/oda-01/camadas/dominio.py
    commit: e81982a
    contexto: O arquivo `dominio.py` contém a camada de domínio da agenda clínica, onde fica a regra de conflito de horários.
    inicio: 6
    linhas:
    - '@dataclass(frozen=True)'
    - 'class Horario:'
    - '    inicio: str'
    - '    fim: str'
    - ''
    - '    def conflita_com(self, outro: "Horario") -> bool:'
    - '        return self.inicio < outro.fim and outro.inicio < self.fim'
    - ''
    - '    def __str__(self) -> str:'
    - '        return f"{self.inicio}–{self.fim}"'
    anotacoes:
    - linha: 11
      texto: Dois horários conflitam quando um deles começa antes do fim do outro.
  - tipo: conceito
    titulo: Regras de negócio na camada de domínio
    texto: Na organização em camadas, as regras de negócio ficam na camada de domínio. A camada de serviço coordena o caso
      de uso e delega a decisão ao domínio. No método `agendar`, o serviço obtém do repositório as consultas do médico e usa
      o método `conflita_com` do domínio para decidir se o novo horário pode ser gravado. Uma regra escrita dentro do serviço
      ficaria vinculada a um único caso de uso e precisaria ser repetida em outros casos de uso que dependem dela, como uma
      futura remarcação de consulta.
  - tipo: editor
    rotulo: arquivo
    caminho: codigo/oda-01/camadas/servicos.py
    commit: e81982a
    contexto: O arquivo `servicos.py` contém a camada de serviço. O método `agendar` coordena o caso de uso e consulta o domínio
      antes de gravar a consulta.
    inicio: 15
    linhas:
    - '    def agendar(self, medico: str, paciente: str, inicio: str, fim: str) -> Consulta:'
    - '        horario = Horario(inicio, fim)'
    - '        for ocupada in self._repositorio.agendadas_do_medico(medico):'
    - '            if ocupada.horario.conflita_com(horario):'
    - '                raise ConflitoDeAgenda('
    - '                    f"Dr(a). {medico} já tem consulta das {ocupada.horario.inicio} "'
    - '                    f"às {ocupada.horario.fim}."'
    - '                )'
    - '        return self._repositorio.salvar(medico, paciente, horario)'
    anotacoes:
    - linha: 17
      texto: O serviço obtém os dados do repositório.
    - linha: 18
      texto: A decisão sobre o conflito pertence ao domínio, no método `conflita_com`.
    - linha: 23
      texto: O serviço grava a consulta somente depois da decisão do domínio.
  - tipo: conceito
    titulo: Conversão do erro de domínio em HTTP
    texto: A camada de apresentação devolve `HTTP 409 CONFLICT` quando o horário pedido está ocupado. Antes disso, o serviço
      consulta a regra do domínio e lança o erro `ConflitoDeAgenda` quando o domínio indica conflito. A apresentação captura
      esse erro e o converte no código HTTP correspondente, o que permite testar a regra de conflito sem iniciar um servidor
      web.
  - tipo: editor
    rotulo: arquivo
    caminho: codigo/oda-01/camadas/apresentacao.py
    commit: e81982a
    contexto: O arquivo `apresentacao.py` contém a camada de apresentação. O trecho abaixo é o único ponto do código que conhece
      os códigos HTTP 201 e 409.
    inicio: 15
    linhas:
    - '    def post_consultas(self, medico: str, paciente: str, inicio: str, fim: str) -> None:'
    - '        try:'
    - '            consulta = self._servico.agendar(medico, paciente, inicio, fim)'
    - '        except ConflitoDeAgenda as erro:'
    - '            print(f"HTTP 409 CONFLICT → {{''erro'': ''{erro}''}}")'
    - '            return'
    - '        print(f"HTTP 201 CREATED → {self._como_dicionario(consulta)}")'
    anotacoes:
    - linha: 18
      texto: A apresentação converte o erro de domínio no código HTTP 409.
  - tipo: conceito
    titulo: Camada fechada e camada aberta
    texto: Uma camada fechada obriga toda chamada a passar por ela, o que protege as regras decididas nela. Uma camada aberta
      admite um atalho deliberado, que precisa ser documentado porque reduz o isolamento entre as camadas.
  - tipo: conceito
    titulo: Sumidouro
    texto: O anti-padrão chamado sumidouro ocorre quando a maioria das chamadas apenas repassa os dados de uma camada para
      a seguinte. Richards e Ford recomendam reavaliar o estilo quando mais de 80% das requisições seguem esse padrão.
  - tipo: conceito
    titulo: Monólito e monólito modular
    texto: Monólito é um sistema com exatamente uma unidade de implantação, isto é, um único pacote colocado em produção numa
      só operação. O monólito modular divide esse pacote em módulos por capacidade de negócio, como a Agenda e o Faturamento.
      Cada módulo é dono dos próprios dados e oferece aos outros módulos apenas um contrato público, e o código fora do contrato
      é interno ao módulo.
  - tipo: diagrama
    id: D-02
    tipo_diagrama: Fronteira entre módulos
    titulo: Agenda e Faturamento numa única implantação
    mermaid: "flowchart LR\n    subgraph fa[\"Módulo faturamento\"]\n        REL[\"relatorio.py\"]\n        ATA[\"relatorio_com_atalho.py\"\
      ]\n    end\n    subgraph ag[\"Módulo agenda\"]\n        API[\"api.py<br/>contrato público\"] --> INT[(\"interno/<br/>modelo\
      \ e dados\")]\n    end\n    REL -->|\"permitido\"| API\n    ATA -. \"proibido\" .-> INT"
  - tipo: editor
    rotulo: arquivo
    caminho: codigo/oda-01/monolito-modular/agenda/api.py
    commit: e81982a
    contexto: O arquivo `agenda/api.py` contém o contrato público do módulo Agenda. O método `consultas_faturaveis` devolve
      o tipo `ConsultaFaturavel` e converte o código interno de situação usado pela Agenda.
    inicio: 38
    linhas:
    - '    def consultas_faturaveis(self) -> list[ConsultaFaturavel]:'
    - '        return ['
    - '            ConsultaFaturavel(r.id, r.paciente, r.procedimento, r.valor_centavos / 100)'
    - '            for r in armazenamento.RESERVAS'
    - '            if r.situacao == REALIZADA'
    anotacoes:
    - linha: 42
      texto: A conversão do modelo interno fica dentro do módulo Agenda.
  - tipo: conceito
    titulo: Leitura de dados internos de outro módulo
    texto: O anti-padrão característico do monólito modular é a importação do interior de outro módulo. No exemplo, `relatorio_com_atalho.py`
      lê a lista interna de reservas e compara a situação com o texto `"realizada"`. A versão 2 do modelo interno da Agenda
      passou a gravar o código `"RE"`, e desde essa mudança o atalho devolve zero consultas sem mensagem de erro.
  - tipo: editor
    rotulo: arquivo
    caminho: codigo/oda-01/monolito-modular/faturamento/relatorio_com_atalho.py
    commit: e81982a
    contexto: O arquivo `faturamento/relatorio_com_atalho.py` contém a forma errada, mantida no repositório para comparação.
    inicio: 8
    linhas:
    - from agenda.interno.armazenamento import RESERVAS
    - ''
    - ''
    - 'class RelatorioFaturamentoComAtalho:'
    - '    def gerar(self) -> tuple[int, float]:'
    - '        realizadas = [r for r in RESERVAS if r.situacao == "realizada"]'
    - '        return len(realizadas), sum(r.valor_centavos for r in realizadas) / 100'
    anotacoes:
    - linha: 8
      texto: Esta linha importa o interior do módulo Agenda e é a linha acusada pelo verificador.
  - tipo: conceito
    titulo: Fronteira verificada por ferramenta
    texto: A fronteira entre módulos se mantém quando uma ferramenta a verifica a cada mudança, na esteira de integração contínua.
      Em Python essa verificação é feita pelo import-linter, e o material oficial lista as ferramentas equivalentes de outros
      ecossistemas. O arquivo `verificar_fronteiras.py` aplica a mesma verificação em menos de 50 linhas e é executado no
      Laboratório.
  - tipo: comparativo
    colunas:
    - Camadas
    - Monólito modular
    linhas:
    - dimensao: Critério de divisão do código
      valores:
      - Responsabilidade técnica
      - Capacidade de negócio
    - dimensao: Fronteira principal
      valores:
      - Chamadas permitidas entre camadas
      - Contrato público de cada módulo
    - dimensao: Anti-padrão
      valores:
      - Sumidouro ou atalho oculto
      - Leitura de dados internos de outro módulo
    - dimensao: Custo geral (1 a 5)
      valores:
      - '5'
      - '5'
    - dimensao: Modularidade (1 a 5)
      valores:
      - '2'
      - '4'
    - dimensao: Testabilidade (1 a 5)
      valores:
      - '3'
      - '4'
  - tipo: conceito
    titulo: ADR
    texto: ADR é a sigla de Architecture Decision Record, em português registro de decisão arquitetural. O ADR é um documento
      curto e versionado junto com o código que registra uma escolha de arquitetura e os motivos dela. Quem chega ao projeto
      depois consulta o ADR para conhecer esses motivos. O bloco abaixo contém um ADR de exemplo para o sistema desta ODA,
      com os campos do template do material oficial.
  - tipo: adr
    id: ADR-001
    titulo: Organizar a plataforma clínica como monólito modular com camadas por módulo
    status: Aceita (exemplo didático)
    contexto: A plataforma clínica tem os módulos Agenda e Faturamento, mantidos por uma única equipe que implanta o sistema
      inteiro numa só operação. A regra de conflito de horários precisa ser testada sem servidor web, e o Faturamento precisa
      da lista de consultas realizadas na Agenda.
    decisao: Adotar um monólito modular com os módulos agenda e faturamento, cada um organizado internamente em camadas. Um
      módulo consome outro módulo apenas pelo arquivo api.py, e o verificador de fronteiras é executado a cada mudança.
    alternativas: A organização do sistema inteiro em camadas únicas foi descartada porque permite que o Faturamento leia
      os dados internos da Agenda. Microsserviços foram descartados porque a equipe e a operação ainda formam uma unidade
      e nenhuma necessidade de escala independente foi medida.
    consequencias: O sistema mantém uma única implantação com transações locais, e a manutenção das fronteiras passa a depender
      do verificador. Um módulo poderá ser extraído para um serviço no futuro se uma medição justificar a extração.
  - tipo: faixa
    estilo: dica
    titulo: 📚 No material oficial
    texto: As notas de 1 a 5 do comparativo vêm das tabelas de características arquiteturais do material oficial, que seguem
      Richards e Ford. Os links abaixo levam às seções usadas nesta aba.
    links:
    - *id002
    - *id003
    - &id005
      rotulo: Material oficial · Fronteiras verificadas por ferramenta
      url: https://marco-mendes.github.io/arquitetura-software/modulo-1-visao-geral/padroes-e-decisoes/#fronteiras-verificadas-por-ferramenta
    - *id001
    - &id006
      rotulo: Material oficial · Template de ADR
      url: https://marco-mendes.github.io/arquitetura-software/referencia/template-adr/
- id: laboratorio
  titulo: Laboratório
  blocos:
  - tipo: legenda
    texto: O Laboratório executa três programas prontos e pede a leitura da saída de cada um. Nenhum arquivo precisa ser alterado,
      e o tempo previsto é de 12 minutos.
  - tipo: glossario
    titulo: 📘 Conceitos usados nesta aba
    texto: Os termos técnicos desta aba estão explicados abaixo na ordem em que aparecem.
    itens:
    - termo: Terminal
      definicao: Programa em que se digitam comandos de texto, chamado PowerShell no Windows e Terminal no macOS e no Linux.
        O VS Code abre um terminal integrado pelo menu Terminal › Novo Terminal.
    - termo: cd
      definicao: Comando que muda a pasta atual do terminal. Cada programa desta ODA precisa ser executado de dentro da própria
        pasta.
    - termo: Camada
      definicao: Grupo de código com uma única responsabilidade técnica. A agenda clínica tem quatro camadas, listadas na
        aba Conceitos.
    - termo: Contrato público
      definicao: Conjunto de funções e tipos que um módulo oferece aos demais módulos. O contrato da Agenda é o arquivo `agenda/api.py`.
    - termo: Verificador de fronteiras
      definicao: Programa que lê os imports do código e acusa todo módulo que importa o interior de outro módulo.
  - tipo: faixa
    estilo: objetivo
    problema: Na agenda clínica, a regra de conflito precisa ficar num único lugar do código. No monólito modular, o Faturamento
      consegue importar os dados internos da Agenda porque a linguagem permite essa importação.
    impacto: Uma regra repetida em vários arquivos precisa ser alterada em cada um deles. Um atalho entre módulos passa a
      produzir resultado errado sem mensagem de erro quando o modelo interno muda, como mostra a cobrança zerada do segundo
      programa.
    mecanismo: A agenda concentra a regra no domínio e converte o erro em HTTP somente na apresentação. O monólito expõe a
      Agenda pelo arquivo `agenda/api.py`, e o programa `verificar_fronteiras.py` acusa toda importação de `agenda.interno`
      feita fora da Agenda.
    comprovacao: A agenda devolve 409 para o pedido das 09:15, e o relatório pelo contrato fatura 2 consultas no total de
      R$ 450,00. O relatório pelo atalho fatura R$ 0,00, e o verificador aponta a linha 8 de `faturamento/relatorio_com_atalho.py`.
  - tipo: faixa
    estilo: dica
    titulo: 💻 Comandos por sistema operacional
    texto: Os comandos desta aba usam `python3`, que é o nome do interpretador Python no macOS e no Linux. No Windows o mesmo
      programa é executado pelo comando `py`, como em `py main.py`. O comando `cd` funciona da mesma forma no PowerShell e
      aceita a barra `/` nos caminhos de pasta.
  - tipo: passos
    itens:
    - titulo: Abrir o terminal na raiz do repositório
      texto: No VS Code, abra a pasta `odas-arquitetura-software` pelo menu Arquivo › Abrir Pasta. Em seguida, abra um terminal
        pelo menu Terminal › Novo Terminal, que já começa na raiz do repositório.
      editor:
        rotulo: terminal
        linhas:
        - git pull
    - titulo: Executar a agenda em camadas
      texto: Entre na pasta da agenda e execute o cenário, cuja saída esperada aparece abaixo deste passo.
      editor:
        rotulo: terminal
        linhas:
        - cd codigo/oda-01/camadas
        - python3 main.py
  - tipo: editor
    rotulo: saida
    origem: executado
    linhas:
    - == Agendamentos válidos ==
    - 'HTTP 201 CREATED → {''id'': 1, ''medico'': ''Dra. Ana Silva'', ''paciente'': ''Maria Santos'', ''horario'': ''09:00–09:30'',
      ''status'': ''agendada''}'
    - 'HTTP 201 CREATED → {''id'': 2, ''medico'': ''Dra. Ana Silva'', ''paciente'': ''João Lima'', ''horario'': ''10:00–10:30'',
      ''status'': ''agendada''}'
    - 'HTTP 201 CREATED → {''id'': 3, ''medico'': ''Dr. Paulo Reis'', ''paciente'': ''Ana Costa'', ''horario'': ''09:00–09:30'',
      ''status'': ''agendada''}'
    - ''
    - == Conflito de horário ==
