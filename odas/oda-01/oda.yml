- id: verificacao
  titulo: Verificação
  blocos:
  - tipo: legenda
    texto: As perguntas abaixo tratam do conteúdo do Módulo 1 do material oficial. Cada alternativa exibe uma explicação depois
      da escolha.
  - tipo: quiz
    perguntas:
    - enunciado: Em qual camada deve ficar uma regra de negócio como a proibição de consultas sobrepostas?
      alternativas:
      - texto: Na camada de serviço, porque o serviço executa o caso de uso.
        correta: false
        explicacao: A camada de serviço, chamada de aplicação no material oficial, coordena o caso de uso e delega a decisão
          ao domínio. Uma regra escrita no serviço precisaria ser repetida em cada caso de uso que depende dela.
      - texto: Na camada de domínio, que preserva as regras e as invariantes do negócio.
        correta: true
        explicacao: Na agenda clínica, o método `agendar` do serviço chama o método `conflita_com` de `dominio.py` para decidir
          o conflito.
      - texto: Na camada de apresentação, porque ela devolve o código HTTP 409.
        correta: false
        explicacao: A apresentação traduz a interação e o formato e converte o erro de domínio no código HTTP correspondente.
    - enunciado: O que o material oficial chama de invariante?
      alternativas:
      - texto: Uma condição que precisa valer sempre, como um saldo que nunca pode ficar negativo.
        correta: true
        explicacao: A camada de domínio preserva as invariantes do negócio.
      - texto: Uma configuração de infraestrutura que não muda entre ambientes.
        correta: false
        explicacao: Configuração de ambiente pertence à camada de infraestrutura.
      - texto: Uma camada que nunca pode ser alterada depois da primeira versão.
        correta: false
        explicacao: A invariante é uma condição do negócio, e as camadas continuam sujeitas a mudanças.
    - enunciado: Qual é o efeito de declarar uma camada como fechada?
      alternativas:
      - texto: A camada deixa de ser chamada por outras camadas.
        correta: false
        explicacao: A camada fechada continua sendo chamada pela camada de cima.
      - texto: Toda requisição passa obrigatoriamente pela camada, o que protege as regras decididas nela.
        correta: true
        explicacao: O material oficial registra o custo dessa escolha, que é a travessia obrigatória mesmo em requisições
          simples.
      - texto: A camada passa a acessar o banco de dados diretamente.
        correta: false
        explicacao: O acesso direto da apresentação à camada de dados é o exemplo de camada aberta.
    - enunciado: Segundo a regra prática de Richards e Ford, quando o estilo em camadas provavelmente não é o adequado?
      alternativas:
      - texto: Quando o sistema tem mais de quatro camadas.
        correta: false
        explicacao: A regra prática trata da proporção de requisições, sem limite de camadas.
      - texto: Quando mais de 80% das requisições apenas repassam os dados de uma camada para a seguinte.
        correta: true
        explicacao: Essa situação corresponde ao anti-padrão do sumidouro.
      - texto: Quando a equipe usa um framework MVC.
        correta: false
        explicacao: O MVC é uma especialização do estilo em camadas para o ciclo requisição-resposta HTTP.
    - enunciado: A Lei de Conway explica por que o estilo em camadas surge com frequência sem decisão deliberada. O que essa
        lei afirma?
      alternativas:
      - texto: Organizações produzem arquiteturas que espelham a estrutura de comunicação delas.
        correta: true
        explicacao: Uma equipe dividida por especialidade técnica tende a produzir um sistema em camadas com a mesma divisão.
      - texto: Todo sistema em camadas acaba se tornando um sumidouro.
        correta: false
        explicacao: O sumidouro é um anti-padrão do estilo em camadas, descrito em outra seção do material oficial.
      - texto: A quantidade de camadas dobra a cada versão do sistema.
        correta: false
        explicacao: A Lei de Conway relaciona a estrutura da organização à estrutura do sistema.
    - enunciado: Um sistema com responsabilidades misturadas entre camadas passa a rodar em três servidores, um por camada.
        Qual é o efeito sobre o acoplamento lógico?
      alternativas:
      - texto: O acoplamento desaparece, porque as camadas ficam em processos separados.
        correta: false
        explicacao: Camadas físicas são uma decisão separada da estrutura lógica.
      - texto: O acoplamento permanece, porque a distribuição física não corrige responsabilidades mal definidas.
        correta: true
        explicacao: O material oficial afirma que um sistema com responsabilidades misturadas continua acoplado mesmo em servidores
          separados.
      - texto: O acoplamento aumenta somente na camada de apresentação.
        correta: false
        explicacao: A distribuição física acrescenta latência de rede e mantém o acoplamento lógico existente.
    - enunciado: Como o princípio aberto-fechado (OCP) se aplica à fronteira entre a camada de negócios e os dados?
      alternativas:
      - texto: A camada de negócios depende de uma abstração de repositório, e a troca de banco de dados não altera o serviço
          de negócio.
        correta: true
        explicacao: No exemplo do material oficial, `AgendamentoServico` depende de `RepositorioConsulta`, e a implementação
          concreta fica na infraestrutura.
      - texto: A camada de negócios abre conexões com o banco e as fecha ao fim de cada requisição.
        correta: false
        explicacao: O OCP trata da extensão de comportamento sem modificação do código existente.
      - texto: Cada camada pode ser aberta ou fechada conforme o volume de requisições.
        correta: false
        explicacao: A escolha entre camada aberta e fechada é outro conceito do mesmo capítulo.
    - enunciado: Qual é a definição de monólito adotada no material oficial, atribuída a Kamil Grzybek?
      alternativas:
      - texto: Um sistema sem organização interna.
        correta: false
        explicacao: Um monólito pode ter boa organização interna, como o monólito modular.
      - texto: Um sistema com exatamente uma unidade de implantação.
        correta: true
        explicacao: A definição separa a decisão de implantação da decisão de organização interna.
      - texto: Um sistema escrito numa única linguagem de programação.
        correta: false
        explicacao: A linguagem de programação está fora da definição.
    - enunciado: No monólito modular, qual regra de comunicação preserva a autonomia de cada módulo?
      alternativas:
      - texto: Os módulos compartilham as mesmas tabelas para evitar duplicação de dados.
        correta: false
        explicacao: O material oficial permite compartilhar o banco físico e proíbe compartilhar tabelas ou modelos de escrita.
      - texto: Um módulo consome outro apenas pela API pública, e cada conjunto de dados tem um único escritor.
        correta: true
        explicacao: O anti-padrão correspondente é o módulo que lê dados internos de outro módulo.
      - texto: Cada módulo roda num processo separado.
        correta: false
        explicacao: O monólito modular mantém uma única unidade de implantação.
    - enunciado: Segundo o material oficial, quando a extração de um módulo para um serviço separado se justifica?
      alternativas:
      - texto: Desde o início do projeto, como plano principal.
        correta: false
        explicacao: O material oficial trata a extração como uma opção que a boa modularidade torna possível.
      - texto: Quando há evidência medida, como um módulo quente que domina os recursos do processo.
        correta: true
        explicacao: Outros gatilhos citados são a coordenação frequente entre módulos e cadências de mudança muito diferentes.
      - texto: Quando o módulo passa de mil linhas de código.
        correta: false
        explicacao: O tamanho do código está fora dos gatilhos listados no material oficial.
  - tipo: resumo
  - tipo: checklist
    titulo: Para revisar depois da aula
    itens:
    - Ler as seções Quando usar camadas e Quando usar monólito modular no material oficial.
    - Comparar o template de ADR do material oficial com o ADR-001 desta ODA.
  - tipo: faixa
    estilo: dica
    titulo: 📚 No material oficial
    texto: Os links abaixo levam às seções do material oficial cobertas pelas perguntas.
    links:
    - rotulo: Material oficial · Quando usar camadas
      url: https://marco-mendes.github.io/arquitetura-software/modulo-1-visao-geral/padroes-e-decisoes/#quando-usar-e-quando-nao-usar
    - rotulo: Material oficial · Quando usar monólito modular
      url: https://marco-mendes.github.io/arquitetura-software/modulo-1-visao-geral/padroes-e-decisoes/#quando-usar-monolito-modular-e-quando-nao-usar
    - *id006
