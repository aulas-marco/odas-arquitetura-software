- id: verificacao
  titulo: Verificação
  blocos:
  - tipo: legenda
    texto: Responda às cinco perguntas. Cada alternativa traz uma explicação depois da escolha, com referência ao que você
      viu nas abas anteriores.
  - tipo: quiz
    perguntas:
    - enunciado: Na agenda clínica em camadas, qual arquivo decide que dois horários conflitam?
      alternativas:
      - texto: '`apresentacao.py`'
        correta: false
        explicacao: A apresentação só traduz o erro `ConflitoDeAgenda` em HTTP 409.
      - texto: '`dominio.py`'
        correta: true
        explicacao: O método `conflita_com` da classe `Horario` é a regra de negócio, na camada de domínio.
      - texto: '`repositorios.py`'
        correta: false
        explicacao: O repositório apenas guarda e recupera consultas.
    - enunciado: O que caracteriza o anti-padrão do sumidouro no estilo em camadas?
      alternativas:
      - texto: Uma camada que acessa o banco de dados.
        correta: false
        explicacao: Acessar o banco é a responsabilidade do repositório.
      - texto: A maioria das chamadas atravessa as camadas sem que nenhuma decida, valide ou transforme nada.
        correta: true
        explicacao: Richards e Ford sugerem reavaliar o estilo quando mais de 80% das requisições forem assim.
      - texto: Uma camada que lança exceções.
        correta: false
        explicacao: Lançar erro de domínio é legítimo, como faz `ConflitoDeAgenda`.
    - enunciado: Por que o relatório pelo atalho faturou R$ 0,00 sem nenhum erro?
      alternativas:
      - texto: Porque a Agenda cancelou todas as consultas.
        correta: false
        explicacao: Duas consultas foram realizadas, como mostra o relatório pelo contrato.
      - texto: Porque o atalho compara a situação com o texto "realizada", e o modelo interno passou a gravar o código "RE".
        correta: true
        explicacao: O modelo interno mudou legitimamente, e só o contrato público traduz a mudança.
      - texto: Porque o verificador de fronteiras bloqueou a execução.
        correta: false
        explicacao: O verificador é um programa separado e não interfere no relatório.
    - enunciado: O que define um monólito, segundo a definição adotada no material oficial?
      alternativas:
      - texto: Um sistema sem organização interna.
        correta: false
        explicacao: Um monólito pode ser bem organizado, como o monólito modular.
      - texto: Um sistema com exatamente uma unidade de implantação.
        correta: true
        explicacao: A definição, de Kamil Grzybek, separa implantação de organização interna.
      - texto: Um sistema escrito numa única linguagem.
        correta: false
        explicacao: A linguagem não faz parte da definição.
    - enunciado: Qual campo de um ADR registra as opções que foram consideradas e descartadas?
      alternativas:
      - texto: Contexto
        correta: false
        explicacao: O contexto descreve a situação e as restrições.
      - texto: Alternativas
        correta: true
        explicacao: No ADR-001 desta ODA, camadas únicas e microsserviços são as alternativas descartadas.
      - texto: Consequências
        correta: false
        explicacao: As consequências registram os efeitos da decisão tomada.
  - tipo: resumo
  - tipo: checklist
    titulo: Para revisar depois da aula
    itens:
    - Ler as seções Quando usar camadas e Quando usar monólito modular no material oficial.
    - Abrir o template de ADR do material oficial e comparar com o ADR-001 desta ODA.
  - tipo: faixa
    estilo: dica
    titulo: 📚 No material oficial
    texto: As perguntas cobrem as seções Camadas, Monólito modular e ADR da página Padrões e decisões.
    links:
    - rotulo: Material oficial · Quando usar camadas
      url: https://marco-mendes.github.io/arquitetura-software/modulo-1-visao-geral/padroes-e-decisoes/#quando-usar-e-quando-nao-usar
    - rotulo: Material oficial · Quando usar monólito modular
      url: https://marco-mendes.github.io/arquitetura-software/modulo-1-visao-geral/padroes-e-decisoes/#quando-usar-monolito-modular-e-quando-nao-usar
    - *id006
