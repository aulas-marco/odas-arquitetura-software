    - rotulo: Material oficial · Propriedade dos dados
      url: https://marco-mendes.github.io/arquitetura-software/modulo-3-servicos/conceitos/#propriedade-dos-dados
    - rotulo: Material oficial · Chamadas síncronas e falhas parciais
      url: https://marco-mendes.github.io/arquitetura-software/modulo-3-servicos/conceitos/#chamadas-sincronas-e-falhas-parciais
