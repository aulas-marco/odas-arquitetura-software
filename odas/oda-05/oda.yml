- id: verificacao
  titulo: Verificação
  blocos:
  - tipo: legenda
    texto: As perguntas abaixo tratam do conteúdo do Módulo 3 do material oficial. Cada alternativa exibe uma explicação depois
      da escolha.
  - tipo: quiz
    perguntas:
    - enunciado: Segundo o material oficial, o que acontece com o acoplamento quando uma chamada de função é substituída por
        uma chamada HTTP?
      alternativas:
      - texto: O acoplamento muda de forma e continua existindo.
        correta: true
        explicacao: A chamada remota acrescenta acoplamento temporal, por exemplo.
      - texto: O acoplamento desaparece.
        correta: false
        explicacao: O material afirma que trocar a chamada local por REST desloca o acoplamento.
      - texto: O acoplamento passa a ser só de dados.
        correta: false
        explicacao: Contrato, tempo e implantação continuam presentes.
    - enunciado: Que forma de acoplamento Exames aceita ao consultar Elegibilidade antes de gravar?
      alternativas:
      - texto: Acoplamento temporal.
        correta: true
        explicacao: A solicitação espera a resposta síncrona de Elegibilidade.
      - texto: Acoplamento de dados.
        correta: false
        explicacao: Exames não lê a tabela de Elegibilidade.
      - texto: Acoplamento de implantação.
        correta: false
        explicacao: Os dois serviços são implantados separadamente.
    - enunciado: O que significa banco por serviço no material oficial?
      alternativas:
      - texto: Somente o serviço proprietário acessa diretamente o seu armazenamento.
        correta: true
        explicacao: Os consumidores usam contratos, eventos ou réplicas projetadas.
      - texto: Cada serviço precisa de um servidor de banco físico próprio.
        correta: false
        explicacao: O material diz que schemas ou bancos no mesmo servidor também servem.
      - texto: Cada serviço usa uma tecnologia de banco diferente.
        correta: false
        explicacao: Isso é persistência poliglota, que é outra decisão.
    - enunciado: O que é uma falha parcial?
      alternativas:
      - texto: Uma parte do sistema distribuído funciona e outra não.
        correta: true
        explicacao: Exames responde à saúde e não consegue aceitar solicitação nova.
      - texto: Uma falha que atinge todos os serviços ao mesmo tempo.
        correta: false
        explicacao: Nesse caso nenhuma parte funcionaria.
      - texto: Uma falha que só ocorre no banco de dados.
        correta: false
        explicacao: A falha parcial pode estar em qualquer dependência.
    - enunciado: Por que Exames responde `503` com `dependencia_indisponivel` em vez de `500`?
      alternativas:
      - texto: Porque o `503` torna observável que a dependência está indisponível.
        correta: true
        explicacao: O `500` genérico esconderia a semântica da falha.
      - texto: Porque o `500` é reservado para erros de validação.
        correta: false
        explicacao: Erro de validação no exemplo é `422`.
      - texto: Porque o `503` registra a solicitação para depois.
        correta: false
        explicacao: Nenhuma solicitação é gravada nessa situação.
    - enunciado: No exemplo clínico, por que o material oficial descarta presumir elegibilidade positiva quando Elegibilidade
        cai?
      alternativas:
      - texto: Porque o fallback precisa ser válido para o negócio. Presumir cobertura seria perigoso.
        correta: true
        explicacao: Falhar de forma explícita é a decisão didática.
      - texto: Porque o fallback é sempre proibido.
        correta: false
        explicacao: O material admite fallback quando ele é válido para o negócio.
      - texto: Porque Exames não tem acesso a um cache.
        correta: false
        explicacao: O motivo apontado é o risco clínico.
    - enunciado: Que cuidado o material associa à nova tentativa?
      alternativas:
      - texto: Ela amplia a carga e exige idempotência.
        correta: true
        explicacao: Por isso o programa só repete com espera crescente e usa chave no POST.
      - texto: Ela elimina a necessidade de prazo de espera.
        correta: false
        explicacao: Cada tentativa continua precisando de prazo.
      - texto: Ela só funciona com mensageria.
        correta: false
        explicacao: A nova tentativa do Laboratório usa HTTP.
    - enunciado: Qual é a função do disjuntor segundo a página de conceitos?
      alternativas:
      - texto: Interromper as tentativas quando a dependência está instável.
        correta: true
        explicacao: No Laboratório, os pedidos 4 e 5 não usaram a rede.
      - texto: Repetir a chamada até ela funcionar.
        correta: false
        explicacao: Esse é o papel da nova tentativa.
      - texto: Guardar a última resposta para usar como fallback.
        correta: false
        explicacao: Isso seria um cache, que é outra decisão.
    - enunciado: Por que Exames não repete automaticamente a consulta na Oficina de ferramentas?
      alternativas:
      - texto: Porque a consulta é rápida e uma tempestade de repetições na queda poderia piorar a recuperação.
        correta: true
        explicacao: O texto cita esse risco no orçamento de falha.
      - texto: Porque a consulta não é idempotente.
        correta: false
        explicacao: Uma consulta GET é idempotente.
      - texto: Porque o FastAPI não permite repetir chamadas.
        correta: false
        explicacao: A decisão é de arquitetura.
    - enunciado: O que deve ser documentado antes de adicionar uma chamada síncrona entre serviços?
      alternativas:
      - texto: Os itens da seção orçamento de falha, do prazo de espera à telemetria.
        correta: true
        explicacao: A lista vai do prazo e da política de repetição até os códigos de erro e a telemetria.
      - texto: Somente a URL do serviço chamado.
        correta: false
        explicacao: A URL não descreve o comportamento na falha.
      - texto: Somente o tempo médio de resposta.
        correta: false
        explicacao: O tempo médio esconde o comportamento na falha.
  - tipo: resumo
  - tipo: checklist
    titulo: Para revisar depois da aula
    itens:
    - Ler a seção Chamadas síncronas e falhas parciais da página de conceitos.
    - Comparar a saída de `demo_falha_parcial.py` com o Resultado esperado da Oficina de ferramentas.
