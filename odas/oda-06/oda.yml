- id: verificacao
  titulo: Verificação
  blocos:
  - tipo: legenda
    texto: As perguntas abaixo tratam do conteúdo do Módulo 3 do material oficial. Cada alternativa exibe uma explicação depois
      da escolha.
  - tipo: quiz
    perguntas:
    - enunciado: Segundo o material oficial, o que existe entre serviços quando uma etapa posterior falha?
      alternativas:
      - texto: Nenhum rollback automático de todas as decisões.
        correta: true
        explicacao: Cada serviço já confirmou a própria transação local.
      - texto: Um rollback automático feito pelo banco.
        correta: false
        explicacao: Cada serviço tem o próprio banco.
      - texto: Uma transação ACID distribuída.
        correta: false
        explicacao: O material afirma que a SAGA não é uma transação ACID distribuída.
    - enunciado: O que uma SAGA coordena?
      alternativas:
      - texto: Uma sequência de transações locais, com compensações quando uma etapa posterior falha.
        correta: true
        explicacao: É a definição da seção SAGA.
      - texto: Uma única transação que abrange vários bancos.
        correta: false
        explicacao: Esse seria um commit distribuído, que a SAGA evita.
      - texto: A separação entre leitura e escrita.
        correta: false
        explicacao: Esse é o papel do CQRS.
    - enunciado: Quais são os três elementos que toda SAGA declara?
      alternativas:
      - texto: Passos, operações compensatórias e coordenação.
        correta: true
        explicacao: A ausência de qualquer um é o defeito mais comum.
      - texto: Comandos, consultas e projeções.
        correta: false
        explicacao: Esses termos pertencem ao CQRS.
      - texto: Produtor, tópico e consumidor.
        correta: false
        explicacao: Esses termos descrevem mensageria.
    - enunciado: Por que uma compensação não equivale a desfazer o passado?
      alternativas:
      - texto: Porque ela não apaga o que ocorreu, pode falhar e outros participantes podem ter visto o estado intermediário.
        correta: true
        explicacao: Por isso o programa tem o estado `requer_intervencao`.
      - texto: Porque ela sempre exige intervenção humana.
        correta: false
        explicacao: No cenário 2 as compensações rodaram sem intervenção.
      - texto: Porque ela só pode ser executada pelo banco.
        correta: false
        explicacao: A compensação é uma ação de negócio do participante.
    - enunciado: Em que ordem o orquestrador aciona as compensações?
      alternativas:
      - texto: Em ordem inversa à da execução dos passos.
        correta: true
        explicacao: No cenário 2, Autorização foi compensada antes de Agenda.
      - texto: Na mesma ordem da execução.
        correta: false
        explicacao: A ordem inversa desfaz primeiro o efeito mais recente.
      - texto: Em paralelo, sem ordem.
        correta: false
        explicacao: O material descreve a ordem inversa na orquestração.
    - enunciado: Qual é o custo da orquestração apontado pelo material oficial?
      alternativas:
      - texto: Um componente que precisa ser mantido e se torna dependência de todos os passos.
        correta: true
        explicacao: Em troca, a sequência fica num lugar auditável.
      - texto: A sequência fica espalhada entre os serviços.
        correta: false
        explicacao: Isso descreve a coreografia.
      - texto: A impossibilidade de compensar passos.
        correta: false
        explicacao: O orquestrador aciona as compensações.
    - enunciado: Por que os comandos da SAGA precisam ser idempotentes?
      alternativas:
      - texto: Porque mensagens podem duplicar e o orquestrador pode reenviar comandos.
        correta: true
        explicacao: No cenário 4, o reenvio não alterou os bancos.
      - texto: Porque idempotência dispensa as compensações.
        correta: false
        explicacao: As compensações continuam necessárias na falha.
      - texto: Porque idempotência torna a SAGA uma transação ACID.
        correta: false
        explicacao: A SAGA continua sendo uma sequência de transações locais.
    - enunciado: O que o CQRS exige, segundo o material oficial?
      alternativas:
      - texto: Modelos separados de comando e consulta, sem exigir dois bancos, mensageria ou Event Sourcing.
        correta: true
        explicacao: A separação pode começar no mesmo processo.
      - texto: Dois bancos de dados.
        correta: false
        explicacao: O material afirma que o CQRS não exige dois bancos.
      - texto: Event Sourcing.
        correta: false
        explicacao: Event Sourcing é outra decisão, com custos próprios.
    - enunciado: Que custo um modelo de leitura materializado traz?
      alternativas:
      - texto: Atualização, defasagem, reconstrução e monitoramento.
        correta: true
        explicacao: No Laboratório, a defasagem e a reconstrução ficaram visíveis.
      - texto: Perda das invariantes do modelo de comando.
        correta: false
        explicacao: As invariantes continuam no modelo de comando.
      - texto: Nenhum custo, porque a consulta fica mais rápida.
        correta: false
        explicacao: O material pede que o CQRS não seja aplicado por padrão.
    - enunciado: Quando o material oficial considera que a SAGA se justifica?
      alternativas:
      - texto: Quando a mudança atravessa mais de um dono de dados e não há como reuni-los.
        correta: true
        explicacao: Consolidar num serviço com transação local deve ser avaliado primeiro.
      - texto: Sempre que houver mais de um serviço.
        correta: false
        explicacao: O laboratório de dois passos não precisa de SAGA.
      - texto: Sempre que houver mensageria.
        correta: false
        explicacao: A SAGA pode ser orquestrada sem mensageria.
  - tipo: resumo
  - tipo: checklist
    titulo: Para revisar depois da aula
    itens:
    - Ler a tabela O que a SAGA cobra e localizar cada custo na saída de `saga/demo.py`.
    - Ler a seção CAP sem o triângulo simplista e comparar com a demonstração de partição do professor.
  - tipo: faixa
    estilo: dica
    titulo: 📚 No material oficial
    texto: Os links abaixo levam às seções do material oficial cobertas pelas perguntas.
    links:
