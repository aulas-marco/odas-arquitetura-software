      url: https://marco-mendes.github.io/arquitetura-software/modulo-3-servicos/padroes-e-decisoes/#consistencia-local-e-consistencia-entre-servicos
    - rotulo: Material oficial · SAGA
      url: https://marco-mendes.github.io/arquitetura-software/modulo-3-servicos/padroes-e-decisoes/#saga
    - rotulo: Material oficial · Os três elementos que toda SAGA declara
      url: https://marco-mendes.github.io/arquitetura-software/modulo-3-servicos/padroes-e-decisoes/#os-tres-elementos-que-toda-saga-declara
    - rotulo: Material oficial · Coreografia e orquestração
      url: https://marco-mendes.github.io/arquitetura-software/modulo-3-servicos/padroes-e-decisoes/#coreografia-e-orquestracao
