    - '[AG-102] Autorização: autorizacao_cancelada'
    - '[AG-102] Agenda: horario_liberado'
    - '[AG-102] situação final: compensada'
    - 'Bancos locais:'
    - '  Agenda: horario_liberado'
    - '  Autorização: autorizacao_cancelada'
    - '  Preparo de Sala: sem registro'
