id: '06'
titulo: SAGA e CQRS
abas:
- id: objetivo
  titulo: Objetivo
  blocos:
  - tipo: legenda
    texto: Esta ODA executa uma SAGA de agendamento de exame com três participantes e uma projeção de leitura para o painel
      gerencial. A atividade dura 25 minutos distribuídos entre as quatro abas.
  - tipo: glossario
    texto: Os termos abaixo aparecem nas abas desta ODA na ordem em que surgem. Cada aba repete a explicação do termo no primeiro
      uso, porque o aluno pode abrir qualquer aba diretamente.
    itens:
    - termo: Transação local
      definicao: Alteração confirmada por um único serviço no próprio banco. Entre serviços não existe rollback automático.
      referencia:
        rotulo: Material oficial · Consistência local e entre serviços
        url: https://marco-mendes.github.io/arquitetura-software/modulo-3-servicos/padroes-e-decisoes/#consistencia-local-e-consistencia-entre-servicos
    - termo: SAGA
      definicao: Sequência de transações locais em serviços diferentes. Se uma etapa posterior falha, operações compensatórias
        tentam neutralizar o efeito das anteriores.
      referencia:
        rotulo: Material oficial · SAGA
        url: https://marco-mendes.github.io/arquitetura-software/modulo-3-servicos/padroes-e-decisoes/#saga
    - termo: Operação compensatória
      definicao: Ação de negócio que neutraliza o efeito de um passo já confirmado, como liberar um horário reservado. Ela
        não apaga o passado e pode falhar.
    - termo: Orquestração
      definicao: Forma de coordenação em que um componente conhece a sequência, chama cada participante e aciona as compensações
        na falha.
    - termo: Coreografia
      definicao: Forma de coordenação em que cada serviço reage aos eventos do anterior, sem componente central.
    - termo: Idempotência
      definicao: Propriedade de um comando que produz o mesmo efeito quando recebido uma ou várias vezes.
    - termo: CQRS
      definicao: Separação entre o modelo que recebe comandos e o modelo que atende consultas, usada quando leitura e escrita
        têm necessidades diferentes.
      referencia:
        rotulo: Material oficial · CQRS
        url: https://marco-mendes.github.io/arquitetura-software/modulo-3-servicos/padroes-e-decisoes/#cqrs
    - termo: Projeção
      definicao: Modelo de leitura montado a partir dos fatos publicados pelo modelo de comando. Pode ser descartado e reconstruído.
    - termo: Defasagem
      definicao: Quantidade de fatos já publicados que a projeção ainda não aplicou. Enquanto ela é maior que zero, a consulta
        mostra um dado antigo.
    - termo: ADR (Architecture Decision Record)
      definicao: Registro de decisão arquitetural. É um documento curto e versionado que registra uma escolha de arquitetura
        e os motivos dela.
      referencia:
        rotulo: Material oficial · Template de ADR
        url: https://marco-mendes.github.io/arquitetura-software/referencia/template-adr/
  - tipo: checklist
    titulo: Ao concluir, você poderá
    itens:
    - Reconhecer na trilha de auditoria os passos, as compensações e a coordenação de uma SAGA orquestrada.
    - Explicar por que uma compensação que falha leva a SAGA ao estado `requer_intervencao`.
    - Explicar como os comandos idempotentes impedem efeito duplicado quando o orquestrador reenvia comandos.
    - Ler a defasagem de uma projeção CQRS e reconstruí-la a partir dos fatos.
  - tipo: faixa
    estilo: dica
    titulo: 🧭 Como ter o código na sua máquina
    texto: O código desta ODA está na pasta `codigo/oda-06/` do repositório `odas-arquitetura-software`, que quem concluiu
      o Módulo 0 já tem clonado e atualiza com `git pull` dentro da pasta dele. Os programas desta ODA usam só a biblioteca
      padrão do Python 3.11 ou mais recente e dispensam a instalação de bibliotecas. Os trechos exibidos nas abas vêm do commit
      `00419ea`, que o botão Ver no GitHub de cada trecho abre no navegador.
    links:
    - rotulo: 'Módulo 0: preparação do ambiente'
      url: https://aulas-marco.github.io/odas-arquitetura-software/modulo-0/
    - rotulo: Repositório no GitHub, commit 00419ea
      url: https://github.com/aulas-marco/odas-arquitetura-software/tree/00419ea
  - tipo: faixa
    estilo: dica
    titulo: 📚 No material oficial
    texto: Os links abaixo levam às seções do Módulo 3 cobertas por esta ODA. O agendamento com Agenda, Autorização e Preparo
      de Sala é o exemplo de SAGA da página Padrões e decisões, que mostra o mesmo código com a saída de uma execução real.
    links:
    - rotulo: Material oficial · Orquestração do agendamento de exame, com código
      url: https://marco-mendes.github.io/arquitetura-software/modulo-3-servicos/padroes-e-decisoes/#orquestracao-do-agendamento-de-exame-em-python
    - rotulo: Material oficial · Comando e projeção no mesmo processo, com código
      url: https://marco-mendes.github.io/arquitetura-software/modulo-3-servicos/padroes-e-decisoes/#comando-e-projecao-no-mesmo-processo
    - rotulo: Material oficial · Consistência local e consistência entre serviços
      url: https://marco-mendes.github.io/arquitetura-software/modulo-3-servicos/padroes-e-decisoes/#consistencia-local-e-consistencia-entre-servicos
    - rotulo: Material oficial · SAGA
      url: https://marco-mendes.github.io/arquitetura-software/modulo-3-servicos/padroes-e-decisoes/#saga
    - rotulo: Material oficial · Coreografia e orquestração
      url: https://marco-mendes.github.io/arquitetura-software/modulo-3-servicos/padroes-e-decisoes/#coreografia-e-orquestracao
    - rotulo: Material oficial · CQRS
      url: https://marco-mendes.github.io/arquitetura-software/modulo-3-servicos/padroes-e-decisoes/#cqrs
- id: conceitos
  titulo: Conceitos
  blocos:
  - tipo: legenda
    texto: Esta aba retoma os conceitos expostos em aula e associa cada conceito a um trecho do código. Os trechos servem
      de referência durante o Laboratório.
  - tipo: faixa
    estilo: dica
    titulo: 📂 Onde está o código
    texto: Os arquivos desta aba ficam em `codigo/oda-06/saga/` e `codigo/oda-06/cqrs/` no repositório `odas-arquitetura-software`.
      O botão Ver no GitHub de cada trecho abre o arquivo completo no navegador. No VS Code, o atalho Ctrl+P no Windows e
      no Linux ou Cmd+P no macOS localiza qualquer arquivo pelo caminho exibido no trecho.
    links:
    - rotulo: Repositório no GitHub, commit 00419ea
      url: https://github.com/aulas-marco/odas-arquitetura-software/tree/00419ea
  - tipo: conceito
    titulo: Consistência entre serviços
    texto: Dentro de um serviço, uma transação ACID preserva as invariantes locais. Entre serviços, cada serviço confirma
      a própria transação local e não existe rollback automático que desfaça o conjunto. Por isso a equipe precisa definir
      quais estados intermediários são legítimos e de que forma uma divergência entre os serviços será reparada.
  - tipo: conceito
    titulo: Passos da SAGA
    texto: Cada participante executa um passo como transação local no próprio banco, que no programa é um dicionário privado
      da classe. O participante também guarda os identificadores dos comandos já aplicados, o que torna o passo idempotente
      quando o mesmo comando chega de novo.
  - tipo: editor
    rotulo: arquivo
    caminho: codigo/oda-06/saga/participantes.py
    commit: 00419ea
    contexto: O arquivo `participantes.py` concentra a regra comum aos três participantes. Um comando repetido é reconhecido
      pelo identificador e não altera o banco.
    inicio: 20
    linhas:
    - '    def _aplicar(self, comando_id, operacao, agendamento_id, situacao):'
    - '        if comando_id in self._processados:'
    - '            return "comando_repetido_sem_efeito"'
    - '        if operacao in self._falhar_em:'
    - '            raise FalhaNoPasso(f"{self.nome} não conseguiu {operacao}")'
    - '        self._banco[agendamento_id] = situacao  # transação local confirmada'
    - '        self._processados.add(comando_id)'
    - '        return situacao'
    anotacoes:
    - linha: 21
      texto: 'Comando já processado: nenhum efeito novo.'
    - linha: 25
      texto: Esta linha é a transação local confirmada.
  - tipo: conceito
    titulo: Coordenação por orquestração
    texto: O orquestrador declara a sequência dos passos num lugar só, chama cada passo e registra o resultado numa trilha
      de auditoria. Quando um passo falha, ele aciona as compensações dos passos já concluídos em ordem inversa à da execução.
      Se uma compensação também falha, a SAGA para no estado `requer_intervencao` porque desfazer o passo não é garantido.
  - tipo: editor
    rotulo: arquivo
    caminho: codigo/oda-06/saga/orquestrador.py
    commit: 00419ea
    contexto: O arquivo `orquestrador.py` percorre os passos na ordem declarada e guarda os passos concluídos para compensá-los
      se um passo posterior falhar.
    inicio: 19
    linhas:
    - '    def executar(self, agendamento_id):'
    - '        concluidos = []'
    - '        for passo in self.passos:'
    - '            comando_id = f"{agendamento_id}:{passo.nome}:executar"'
    - '            try:'
    - '                resultado = passo.executar(comando_id, agendamento_id)'
    - '            except FalhaNoPasso as falha:'
    - '                self._registrar(agendamento_id, f"falha: {falha}")'
    - '                return self._compensar(agendamento_id, concluidos)'
    - '            self._registrar(agendamento_id, f"{passo.nome}: {resultado}")'
    - '            concluidos.append(passo)'
    - '        self._registrar(agendamento_id, "situação final: concluida")'
    - '        return "concluida"'
    anotacoes:
    - linha: 22
      texto: O identificador do comando é estável e permite a idempotência.
    - linha: 27
      texto: A falha de um passo dispara as compensações.
  - tipo: editor
    rotulo: arquivo
    caminho: codigo/oda-06/saga/orquestrador.py
    commit: 00419ea
    contexto: Ainda em `orquestrador.py`, as compensações rodam em ordem inversa e a falha de uma delas encerra a SAGA à espera
      de intervenção.
    inicio: 33
    linhas:
    - '    def _compensar(self, agendamento_id, concluidos):'
    - '        for passo in reversed(concluidos):  # ordem inversa à da execução'
    - '            comando_id = f"{agendamento_id}:{passo.nome}:compensar"'
    - '            try:'
    - '                resultado = passo.compensar(comando_id, agendamento_id)'
    - '            except FalhaNoPasso as falha:'
    - '                self._registrar(agendamento_id, f"falha na compensação: {falha}")'
    - '                self._registrar(agendamento_id, "situação final: requer_intervencao")'
    - '                return "requer_intervencao"'
    - '            self._registrar(agendamento_id, f"{passo.nome}: {resultado}")'
    - '        self._registrar(agendamento_id, "situação final: compensada")'
    - '        return "compensada"'
    anotacoes:
    - linha: 34
      texto: reversed percorre os passos concluídos do último para o primeiro.
    - linha: 41
      texto: Compensação que falha exige intervenção operacional.
  - tipo: diagrama
    id: D-01
    tipo_diagrama: Coordenação
    titulo: SAGA orquestrada do agendamento de exame
    mermaid: "flowchart TB\n    O[\"Orquestrador de agendamento\"] -->|\"1. reservar horário\"| A[\"Agenda\"]\n    O -->|\"\
      2. autorizar procedimento\"| B[\"Autorização\"]\n    O -->|\"3. reservar sala\"| C[\"Preparo de Sala\"]\n    C -.->|\"\
      falha\"| O\n    O -.->|\"compensa 2: cancelar autorização\"| B\n    O -.->|\"compensa 1: liberar horário\"| A"
  - tipo: comparativo
    colunas:
    - Coreografia
    - Orquestração
    linhas:
    - dimensao: Quem conhece a sequência
      valores:
      - Ninguém sozinho, ela emerge das assinaturas de eventos
      - O orquestrador
    - dimensao: Onde ver o estado de um agendamento
      valores:
      - Em vários serviços
      - Na trilha do orquestrador
    - dimensao: Componente a manter
      valores:
      - Nenhum central
      - O orquestrador, dependência de todos os passos
    - dimensao: Indicação do material oficial
      valores:
      - Fluxos curtos e estáveis
      - Fluxos com ramificações e suporte operacional
  - tipo: conceito
    titulo: CQRS
    texto: CQRS separa o modelo que recebe comandos do modelo que atende consultas. O comando expressa uma intenção e preserva
      as invariantes da solicitação, enquanto a consulta lê uma projeção já pronta para a tela. A separação pode começar dentro
      do mesmo processo, sem dois bancos e sem mensageria, como no programa desta ODA.
  - tipo: editor
    rotulo: arquivo
    caminho: codigo/oda-06/cqrs/comandos.py
    commit: 00419ea
    contexto: O arquivo `comandos.py` recusa o cancelamento de uma solicitação que não está solicitada. Cada mudança aceita
      publica um fato.
    inicio: 24
    linhas:
    - '    def cancelar(self, solicitacao_id):'
    - '        atual = self._banco.get(solicitacao_id)'
    - '        if atual is None or atual["situacao"] != "solicitada":'
    - '            raise ComandoRecusado(f"{solicitacao_id} não pode ser cancelada")'
    - '        atual["situacao"] = "cancelada"'
    - '        self.fatos.append({"tipo": "ExameCancelado", "id": solicitacao_id, "unidade": atual["unidade"]})'
    anotacoes:
    - linha: 26
      texto: A invariante é verificada no modelo de comando.
    - linha: 29
      texto: O fato publicado alimenta a projeção.
  - tipo: editor
    rotulo: arquivo
    caminho: codigo/oda-06/cqrs/projecao.py
    commit: 00419ea
    contexto: O arquivo `projecao.py` aplica os fatos ao painel e guarda a posição do último fato aplicado. A diferença entre
      o total de fatos e essa posição é a defasagem.
    inicio: 14
    linhas:
    - '    def processar(self, fatos, limite=None):'
    - '        fim = len(fatos) if limite is None else min(limite, len(fatos))'
    - '        for fato in fatos[self.posicao:fim]:'
    - '            unidade = fato["unidade"]'
    - '            atual = self.ativas_por_unidade.get(unidade, 0)'
    - '            if fato["tipo"] == "ExameSolicitado":'
    - '                self.ativas_por_unidade[unidade] = atual + 1'
    - '            elif fato["tipo"] == "ExameCancelado":'
    - '                self.ativas_por_unidade[unidade] = atual - 1'
    - '        self.posicao = max(self.posicao, fim)'
    anotacoes:
    - linha: 16
      texto: Só os fatos ainda não aplicados são processados.
    - linha: 23
      texto: A posição permite medir a defasagem e retomar o processamento.
  - tipo: conceito
    titulo: SAGA e CQRS resolvem problemas diferentes
    texto: A SAGA coordena uma mudança que atravessa mais de um dono de dados. O CQRS separa as responsabilidades de ler e
      de escrever. O material oficial não recomenda nenhum dos dois por padrão e pede que a alternativa de consolidar os passos
      num serviço com transação local seja avaliada primeiro.
  - tipo: conceito
    titulo: ADR
    texto: ADR é a sigla de Architecture Decision Record, em português registro de decisão arquitetural. O bloco abaixo registra
      a escolha de coordenação desta ODA, com os campos do template do material oficial.
  - tipo: adr
    id: ADR-006
    titulo: Coordenar o agendamento de exame por orquestração
    status: Aceita (exemplo didático)
    contexto: O agendamento atravessa Agenda, Autorização e Preparo de Sala, cada um dono do próprio banco. A equipe de atendimento
      precisa saber em que situação está cada agendamento.
    decisao: Usar um orquestrador que declara a sequência, chama os participantes por comandos idempotentes, compensa em ordem
      inversa e registra cada evento numa trilha de auditoria.
    alternativas: Coreografia por eventos foi descartada porque a situação do agendamento ficaria espalhada em três serviços.
      Consolidar os três passos num serviço foi descartado porque os donos de dados são equipes diferentes.
    consequencias: O orquestrador passa a ser um componente a manter e uma dependência de todos os passos da SAGA. Cada participante
      precisa de uma compensação testada e o estado `requer_intervencao` precisa de um responsável na operação.
  - tipo: faixa
    estilo: dica
    titulo: 📚 No material oficial
    texto: Os links abaixo levam às seções usadas nesta aba.
    links:
    - rotulo: Material oficial · Consistência local e consistência entre serviços
      url: https://marco-mendes.github.io/arquitetura-software/modulo-3-servicos/padroes-e-decisoes/#consistencia-local-e-consistencia-entre-servicos
    - rotulo: Material oficial · Os três elementos que toda SAGA declara
      url: https://marco-mendes.github.io/arquitetura-software/modulo-3-servicos/padroes-e-decisoes/#os-tres-elementos-que-toda-saga-declara
    - rotulo: Material oficial · Coreografia e orquestração
      url: https://marco-mendes.github.io/arquitetura-software/modulo-3-servicos/padroes-e-decisoes/#coreografia-e-orquestracao
    - rotulo: Material oficial · O que a SAGA cobra
      url: https://marco-mendes.github.io/arquitetura-software/modulo-3-servicos/padroes-e-decisoes/#o-que-a-saga-cobra
    - rotulo: Material oficial · CQRS
      url: https://marco-mendes.github.io/arquitetura-software/modulo-3-servicos/padroes-e-decisoes/#cqrs
    - rotulo: Material oficial · Template de ADR
      url: https://marco-mendes.github.io/arquitetura-software/referencia/template-adr/
- id: laboratorio
  titulo: Laboratório
  blocos:
  - tipo: legenda
    texto: O Laboratório executa a SAGA em quatro cenários e a projeção CQRS em quatro momentos. Nenhum arquivo precisa ser
      alterado durante os 12 minutos previstos para a aba.
  - tipo: glossario
    titulo: 📘 Conceitos usados nesta aba
    texto: Os termos técnicos desta aba estão explicados abaixo na ordem em que aparecem.
    itens:
    - termo: Terminal
      definicao: Programa em que se digitam comandos de texto, chamado PowerShell no Windows e Terminal no macOS e no Linux.
        O VS Code abre um terminal integrado pelo menu Terminal › Novo Terminal.
    - termo: Trilha de auditoria
      definicao: Lista de eventos registrada pelo orquestrador, com uma linha por passo, compensação ou falha.
    - termo: Banco local
      definicao: Estado guardado por cada participante. No programa, é um dicionário privado de cada classe.
    - termo: Fato
      definicao: Registro de uma mudança aceita pelo modelo de comando, como `ExameSolicitado`.
    - termo: Defasagem
      definicao: Número de fatos publicados que a projeção ainda não aplicou.
  - tipo: faixa
    estilo: objetivo
    problema: O agendamento de exame altera três bancos de donos diferentes, sem transação que abranja todos. O painel gerencial
      precisa de uma consulta que o modelo de comando não atende bem.
    impacto: Sem compensações, uma falha no último passo deixa horário e autorização presos. Sem medida de defasagem, o painel
      mostra um número antigo sem que ninguém perceba.
    mecanismo: O programa `saga/demo.py` executa o orquestrador em quatro cenários e imprime a trilha e os bancos locais.
      O programa `cqrs/demo.py` consulta o painel antes e depois de processar os fatos.
    comprovacao: A falha no Preparo de Sala aciona a compensação de Autorização e depois a de Agenda. A compensação que falha
      deixa a SAGA no estado `requer_intervencao` com a trilha completa. A projeção passa de defasagem 2 para defasagem 0
      e volta igual depois de reconstruída a partir dos fatos.
  - tipo: faixa
    estilo: dica
    titulo: 💻 Comandos por sistema operacional
    texto: Os programas desta ODA usam só a biblioteca padrão do Python 3.11 ou mais recente, sem ambiente virtual nem `pip
      install`. No macOS e no Linux o comando pode ser `python3` em vez de `python`. No Windows, o comando `cd` aceita a barra
      `/` nos caminhos de pasta também no PowerShell.
  - tipo: passos
    itens:
    - titulo: Abrir o terminal na raiz do repositório
      texto: No VS Code, abra a pasta `odas-arquitetura-software` pelo menu Arquivo › Abrir Pasta. Em seguida, abra um terminal
        pelo menu Terminal › Novo Terminal e atualize o repositório.
      editor:
        rotulo: terminal
        linhas:
        - git pull
    - titulo: Executar a SAGA
      texto: Entre na pasta da SAGA e execute a demonstração. Cada cenário cria participantes novos.
      editor:
        rotulo: terminal
        linhas:
        - cd codigo/oda-06/saga
        - python demo.py
  - tipo: editor
    rotulo: saida
    origem: executado
    linhas:
